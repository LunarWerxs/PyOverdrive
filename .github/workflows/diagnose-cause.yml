name: diagnose-cause

# TEMPORARY, paired with diagnose-hang.yml. That one says WHERE the Linux
# wedge is; this one says WHAT CAUSES it, by re-running the suite with one
# variable changed at a time. Every experiment is bounded by `timeout`, so a
# wedge reports as exit 124 instead of sitting for the job's whole budget.
# Delete once the cause is known and fixed.

on: pull_request

jobs:
  cause:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .[dev]

      # control: the wedging file on its own must be clean, or the cause is
      # inside it rather than in state left by the 1800 tests before it
      - name: A - svd file alone
        run: |
          timeout -s KILL 240 python -m pytest compatibility/differential/test_svd_small_batch_differential.py -q
          echo "A exit=$? (124 = wedged)"
        continue-on-error: true

      # the suspect: PyOverdrive's own thread pool, created by the parallel
      # ufunc tests ~500 tests earlier and still alive. THREADS=1 means no
      # pool is ever built, so a pass here indicts the pool directly.
      - name: B - full suite with PyOverdrive's thread pool disabled
        env:
          PYOVERDRIVE_THREADS: "1"
        run: |
          timeout -s KILL 900 python -m pytest tests compatibility -q
          echo "B exit=$? (124 = wedged)"
        continue-on-error: true

      # minimal pairing: does the pool's mere existence reproduce it without
      # the other 1700 tests?
      - name: C - parallel ufunc tests then the svd file
        run: |
          timeout -s KILL 300 python -m pytest \
            compatibility/differential/test_parallel_ufunc_differential.py \
            compatibility/differential/test_svd_small_batch_differential.py -q
          echo "C exit=$? (124 = wedged)"
        continue-on-error: true

      # same pairing with the pool suppressed, to complete the 2x2
      - name: D - same as C but with the pool disabled
        env:
          PYOVERDRIVE_THREADS: "1"
        run: |
          timeout -s KILL 300 python -m pytest \
            compatibility/differential/test_parallel_ufunc_differential.py \
            compatibility/differential/test_svd_small_batch_differential.py -q
          echo "D exit=$? (124 = wedged)"
        continue-on-error: true

      # the single stock call the wedging test makes, with a pool alive and
      # warm, stripped of pytest entirely
      - name: E - bare repro, no pytest
        run: |
          timeout -s KILL 180 python -c "
          import numpy as np, pyoverdrive
          from pyoverdrive.parallel import pyrallel
          pyoverdrive.enable()
          big = np.random.default_rng(0).standard_normal(4_000_000)
          np.sin(big)  # force the parallel path to build the pool
          print('pool size', pyrallel.pool_size(), flush=True)
          a = np.random.default_rng(230).uniform(-1.0, 1.0, size=(100, 3, 3))
          print('calling stock svd compute_uv=False', flush=True)
          from pyoverdrive.dispatcher.gearbox import GEARBOX
          s = GEARBOX.stock_fn('numpy.linalg.svd')(a, compute_uv=False)
          print('returned', s.shape, flush=True)
          "
          echo "E exit=$? (124 = wedged)"
        continue-on-error: true
