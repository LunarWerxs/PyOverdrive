name: diagnose-stock

# TEMPORARY. The svd differential file wedges on Linux even when run alone,
# so the cause is not state left by other tests. This asks the only question
# that matters next: is STOCK NumPy on its own enough to wedge, with no
# PyOverdrive in the process at all? Delete once the cause is fixed.

on: pull_request

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy only (no pyoverdrive import anywhere below)
        run: python -m pip install numpy

      - name: F1 - stock svd, compute_uv=False, the exact wedging input
        run: |
          timeout -s KILL 90 python -c "
          import numpy as np
          print('numpy', np.__version__, flush=True)
          a = np.random.default_rng(230).uniform(-1.0, 1.0, size=(100, 3, 3))
          print('calling svd(compute_uv=False) on', a.shape, flush=True)
          s = np.linalg.svd(a, compute_uv=False)
          print('OK', s.shape, s[0], flush=True)
          "
          echo "F1 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: F2 - same but d=2 (the size that passes) and compute_uv=True
        run: |
          timeout -s KILL 90 python -c "
          import numpy as np
          a2 = np.random.default_rng(220).uniform(-1.0, 1.0, size=(100, 2, 2))
          print('d=2 svdvals', np.linalg.svd(a2, compute_uv=False).shape, flush=True)
          a3 = np.random.default_rng(230).uniform(-1.0, 1.0, size=(100, 3, 3))
          print('d=3 full svd', np.linalg.svd(a3)[1].shape, flush=True)
          print('d=3 pinv', np.linalg.pinv(a3).shape, flush=True)
          "
          echo "F2 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: F3 - one matrix at a time, to name the culprit if there is one
        run: |
          timeout -s KILL 120 python -c "
          import numpy as np
          a = np.random.default_rng(230).uniform(-1.0, 1.0, size=(100, 3, 3))
          for i in range(a.shape[0]):
              print(i, flush=True)
              np.linalg.svd(a[i], compute_uv=False)
          print('ALL 100 SINGLY OK', flush=True)
          "
          echo "F3 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: F4 - thread and BLAS environment of this runner
        run: |
          python -c "
          import numpy as np, os
          print('numpy', np.__version__, flush=True)
          try:
              print(np.show_config('dicts'), flush=True)
          except Exception as e:
              print('show_config failed', e, flush=True)
          print('cpu_count', os.cpu_count(), flush=True)
          for k, v in sorted(os.environ.items()):
              if 'THREAD' in k.upper() or 'BLAS' in k.upper() or 'OMP' in k.upper():
                  print('env', k, v, flush=True)
          "
        continue-on-error: true
