name: diagnose-stock

# TEMPORARY. Minimal STOCK-NUMPY repro for the Linux hang, with no
# PyOverdrive in the process at all. The faulthandler stack named
# np.linalg.pinv -> np.linalg.svd on a batch holding +inf. On Windows the
# same calls return in ~2ms. Delete once reported and worked around.

on: pull_request

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy only
        run: python -m pip install numpy

      - name: Environment
        run: |
          python -c "
          import numpy as np, os
          print('numpy', np.__version__, flush=True)
          print('cpu_count', os.cpu_count(), flush=True)
          "
        continue-on-error: true

      - name: G1 - nan batch (expected FINE, raises LinAlgError)
        run: |
          timeout -s KILL 60 python -c "
          import numpy as np
          a = np.random.default_rng(1240).uniform(-1.0, 1.0, size=(100, 3, 3))
          a[7, 0, 0] = np.nan
          try:
              np.linalg.pinv(a)
              print('returned', flush=True)
          except np.linalg.LinAlgError as e:
              print('LinAlgError:', e, flush=True)
          "
          echo "G1 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: G2 - inf batch, pinv (SUSPECTED HANG)
        run: |
          timeout -s KILL 60 python -c "
          import numpy as np
          a = np.random.default_rng(1240).uniform(-1.0, 1.0, size=(100, 3, 3))
          a[7, 0, 0] = np.inf
          print('calling pinv on a 100x3x3 batch with one +inf', flush=True)
          r = np.linalg.pinv(a)
          print('returned', np.isnan(r).sum(), 'nans', flush=True)
          "
          echo "G2 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: G3 - the single offending 3x3 matrix alone
        run: |
          timeout -s KILL 60 python -c "
          import numpy as np
          a = np.random.default_rng(1240).uniform(-1.0, 1.0, size=(100, 3, 3))
          a[7, 0, 0] = np.inf
          print('matrix', a[7].tolist(), flush=True)
          r = np.linalg.pinv(a[7])
          print('returned', r, flush=True)
          "
          echo "G3 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: G4 - smallest possible case, identity with one +inf
        run: |
          timeout -s KILL 60 python -c "
          import numpy as np
          m = np.eye(3)
          m[0, 0] = np.inf
          print('calling pinv on', m.tolist(), flush=True)
          print('pinv ->', np.linalg.pinv(m), flush=True)
          "
          echo "G4 exit=$? (124 = wedged)"
        continue-on-error: true

      - name: "G5 - which entry point spins - svd, then norm"
        run: |
          timeout -s KILL 60 python -c "
          import numpy as np
          m = np.eye(3); m[0, 0] = np.inf
          print('svd compute_uv=False ->', np.linalg.svd(m, compute_uv=False), flush=True)
          " ; echo "G5-svd exit=$?"
          timeout -s KILL 60 python -c "
          import numpy as np
          m = np.eye(3); m[0, 0] = np.inf
          print('norm ord=2 ->', np.linalg.norm(m, ord=2), flush=True)
          " ; echo "G5-norm exit=$?"
          timeout -s KILL 60 python -c "
          import numpy as np
          m = np.eye(2); m[0, 0] = np.inf
          print('2x2 svd ->', np.linalg.svd(m, compute_uv=False), flush=True)
          " ; echo "G5-2x2 exit=$?"
        continue-on-error: true
