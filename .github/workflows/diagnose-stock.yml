name: diagnose-stock

# TEMPORARY. Minimal STOCK-NUMPY repro for the Linux hang, no PyOverdrive in
# the process at all. Established so far on ubuntu-latest / numpy 2.5.2:
#   nan batch  -> LinAlgError, fine
#   svd(compute_uv=False) with +inf -> [nan nan nan], fine
#   norm(ord=2) with +inf -> nan, fine
#   pinv(eye(3) with one +inf) -> NEVER RETURNS
# This run pins the exact boundary: which svd spelling spins, and whether the
# batch forms of svd/norm are safe. Delete once reported and worked around.

on: pull_request

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy only
        run: python -m pip install numpy

      - name: Boundary probe
        run: |
          set +e
          probe () {
            echo "=== $1"
            timeout -s KILL 45 python -c "$2"
            rc=$?
            if [ "$rc" -eq 0 ]; then echo "--> $1 RETURNED"; else echo "--> $1 WEDGED_OR_FAILED rc=$rc"; fi
          }

          probe "H1 batch svd compute_uv=False + inf" "
          import numpy as np
          a = np.random.default_rng(1240).uniform(-1.0, 1.0, size=(100, 3, 3)); a[7,0,0] = np.inf
          print(np.linalg.svd(a, compute_uv=False)[7], flush=True)"

          probe "H2 batch norm ord=2 + inf" "
          import numpy as np
          a = np.random.default_rng(1240).uniform(-1.0, 1.0, size=(100, 3, 3)); a[7,0,0] = np.inf
          print(np.linalg.norm(a, ord=2, axis=(-2,-1))[7], flush=True)"

          probe "H3 single svd full_matrices=False + inf" "
          import numpy as np
          m = np.eye(3); m[0,0] = np.inf
          print(np.linalg.svd(m, full_matrices=False)[1], flush=True)"

          probe "H4 single svd default (compute_uv=True) + inf" "
          import numpy as np
          m = np.eye(3); m[0,0] = np.inf
          print(np.linalg.svd(m)[1], flush=True)"

          probe "H5 single pinv + inf (known wedge, control)" "
          import numpy as np
          m = np.eye(3); m[0,0] = np.inf
          print(np.linalg.pinv(m), flush=True)"

          probe "H6 single pinv + NEGATIVE inf" "
          import numpy as np
          m = np.eye(3); m[0,0] = -np.inf
          print(np.linalg.pinv(m), flush=True)"

          probe "H7 single pinv + inf, 2x2" "
          import numpy as np
          m = np.eye(2); m[0,0] = np.inf
          print(np.linalg.pinv(m), flush=True)"

          probe "H8 single pinv + inf, 4x4" "
          import numpy as np
          m = np.eye(4); m[0,0] = np.inf
          print(np.linalg.pinv(m), flush=True)"

          probe "H9 single pinv, inf OFF the diagonal" "
          import numpy as np
          m = np.eye(3); m[0,1] = np.inf
          print(np.linalg.pinv(m), flush=True)"

          probe "H10 eig/eigvals + inf, for contrast" "
          import numpy as np
          m = np.eye(3); m[0,0] = np.inf
          print(np.linalg.eigvals(m), flush=True)"

          echo '=== probe sweep complete ==='
