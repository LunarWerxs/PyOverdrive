name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    # The gate installs in ~20s and runs in ~40s. Without this a wedged test
    # sits until the runner's 6-hour ceiling, which is how a hang first showed
    # up here - as four jobs stuck "in progress", indistinguishable from a
    # queue. Fail in minutes instead; faulthandler_timeout dumps the stacks.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", numpy: "latest" }
          # the oldest numpy the package claims (pyproject: numpy>=2.3);
          # if this job breaks, the claim is wrong and the floor moves
          - { os: ubuntu-latest, python: "3.12", numpy: "==2.3.0" }
          # the middle numpy line both benchmark boxes actually run; the one
          # shipped bug this project ever had lived in exactly this kind of
          # between-floor-and-latest blind spot
          - { os: ubuntu-latest, python: "3.13", numpy: "==2.4.5" }
          - { os: ubuntu-latest, python: "3.14", numpy: "latest" }
          - { os: windows-latest, python: "3.13", numpy: "latest" }
          - { os: macos-latest, python: "3.13", numpy: "latest" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -e .[dev]
          if [ "${{ matrix.numpy }}" != "latest" ]; then python -m pip install "numpy${{ matrix.numpy }}"; fi
        shell: bash
      - name: Self-check (every fast path vs stock on this runner)
        run: python -m pyoverdrive --selfcheck
      - name: Advertised counts still match the registry
        run: python tools/verify_claims.py
      - name: Benchmark evidence is still in compact form
        run: python tools/compact_evidence.py --check
      - name: Performance claims cite versioned evidence
        run: python tools/verify_evidence_cited.py
      - name: Tests
        run: python -m pytest tests compatibility -q

  wheel:
    name: build downloadable packages and verify installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a fresh venv and self-check
        run: |
          python -m venv fresh
          fresh/bin/python -m pip install dist/*.whl
          cd /tmp
          $GITHUB_WORKSPACE/fresh/bin/python -m pyoverdrive --selfcheck
      - name: Upload installable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyoverdrive-dist
          path: dist/*
          if-no-files-found: error
