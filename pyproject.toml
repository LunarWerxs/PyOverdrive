[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoverdrive"
version = "1.0.0"
description = "Drop-in accelerator for NumPy: measured, guarded fast paths behind one enable() call, with automatic fallback to stock NumPy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "LunarWerx Studios" }]
keywords = [
    "numpy", "performance", "acceleration", "optimization", "fast",
    "scientific-computing", "vectorization", "benchmark", "linalg",
]
dependencies = [
    # The split-complex matmul path needs the strided-view BLAS routing
    # introduced in NumPy 2.3; earlier versions suffer severe slowdowns.
    "numpy>=2.5.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LunarWerxs/PyOverdrive"
Repository = "https://github.com/LunarWerxs/PyOverdrive"
Changelog = "https://github.com/LunarWerxs/PyOverdrive/blob/main/CHANGELOG.md"
Issues = "https://github.com/LunarWerxs/PyOverdrive/issues"
"Built by" = "https://getconnections.icu"

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "pyperf",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyoverdrive = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--durations=20"
testpaths = ["tests", "compatibility"]
# Always test this checkout, even if another checkout was installed editable.
pythonpath = ["src"]
# No test in this suite legitimately takes minutes - the whole gate runs in
# well under a minute. A test that blows past this is wedged, not slow, so
# dump every thread's stack (pytest's faulthandler plugin exits after the
# dump) instead of letting a CI job sit at a hang until its 6-hour ceiling.
faulthandler_timeout = 180
