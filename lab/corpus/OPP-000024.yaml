id: OPP-000024
title: "np.unique on single-character U1/S1 arrays runs ~3x faster through an integer view than natively"
sources:
  - url: https://github.com/numpy/numpy/issues/24821
    repository: numpy/numpy
    type: issue
    number: 24821
    state_at_ingestion: open
    retrieved_at: "2026-08-24T03:32:45Z"
claim:
  speedup: 3.06
  baseline: >-
    np.unique(x) directly on a 10,000-element U1 array
    (np.array(list('ASDFGHJKLZ' * 1000), dtype='U1'), a 10-character
    alphabet), as timed by the issue author with %timeit in the issue body
    itself, 204 us +/- 4.61 us per loop (mean +/- std. dev. of 7 runs,
    1,000 loops each). The 3.06 speedup recorded above is DERIVED from the
    reporter's own pair of numbers (204 / 66.7 = 3.06); the thread never
    states a ratio explicitly.
  candidate: >-
    np.unique(x.view(np.int32)).view(x.dtype) on the same 10,000-element U1
    array in the same post, 66.7 us +/- 2.91 us per loop (mean +/- std.
    dev. of 7 runs, 10,000 loops each). A pure-numpy view trick from the
    issue body, no third-party code involved.
  hardware: >-
    unknown; the issue gives no CPU, OS, machine spec, or numpy/Python
    version anywhere in the dump. The reporter also timed the 10-element
    case, unique_basic 2.17 us +/- 40.7 ns vs unique_view 2.53 us +/- 38.4
    ns, i.e. the view path LOSES (2.17 / 2.53 = 0.86x) on tiny arrays, so
    the claim carries its own anti-regime and a crossover threshold
    somewhere between 10 and 10,000 elements.
affected_operations: [numpy.unique]
input_regime:
  dtypes: [U1, S1]
  sizes: [10, 10000]
  notes: >-
    Measured concretely only for U1 with an int32 view, return_counts
    False, at 10 and 10,000 elements drawn from a 10-character alphabet
    ('ASDFGHJKLZ'). The reporter states "I've played with this a number of
    ways (e.g. S1 vs U1; int32 vs int64; return_counts = True vs False;
    100, 1000, or 10k elements) and seem to notice the same pattern", but
    posts numbers only for the U1 / int32 / return_counts False pairs
    above. The 10-element case is a measured loss for the view path
    (0.86x), so the regime is "arrays of decent size" (the reporter's own
    phrase), not all sizes.
status: performance_validated
license_review: clean
reproducer: benchmarks/historical/opp_000024_unique_char_view.py
current_numpy_result:
  verified_speedup: 43.16
  fingerprints: [9bbe7063c555]
  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0-1% load): the MECHANISM reproduces, but the headline lives
    on different surfaces than the claim's. Plain np.unique on U1 via the
    int32 view wins only 1.31-1.55x from n=1000 up (below the 3.06x
    claim, which numpy 2.5's faster string unique likely eroded), and S1
    via uint8 view 1.54-1.73x. The big wins: np.sort on U1 43.16x at
    n=10000 (253.6 us -> 5.9 us) and 25.1x at 1e6, and
    unique(return_counts=True) 26.55x. High-byte S1, Greek U1, and
    ascii94 all check exact. Evidence:
    benchmarks/results/OPP-000024/9bbe7063c555.json.
main_branch_result: null
correctness_risk: low
implementation_risk: low
maintainer_objections:
  - author: ngoldbaum
    date: "2023-09-27"
    quote: >-
      We could probably add a special case in the sorting code to improve
      performance for sorting single-character arrays. I have no idea if
      that would be complicated or would make the code difficult to deal
      with. I'll also note that string sorting is a more general problem
      than integer sorting, since a generic string sort can't assume that
      it is handed single-character strings.
