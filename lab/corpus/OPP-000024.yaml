related_opportunities: []
notes:
  - >-
    SHIPPED (2026-08-24) as sort_char_view + unique_char_view
    (src/pyoverdrive/fastpaths/char_view.py): np.sort AND np.unique (the
    issue title's own suggestion; sort is where the win actually lives)
    on 1-D native-byte-order U1/S1, U1 viewed as int32 and S1 as uint8,
    bit-identical by monotone bijection. Floors from the CHARVIEW-CAL
    battery (benchmarks/results/CHARVIEW-CAL/9bbe7063c555.json, 0% load):
    sort 1000 (U1 3.06x there, 33.1x at 10k, n=100 is a wash; S1
    2.1-2.5x), unique+counts 300 for U1 (1.50x) / 1000 for S1 (2.61x),
    index/inverse 1000 (U1 1.42x, S1 2.38x, 8.72x at 10k), plain unique
    10_000 (the n=1000 1.31x straddles the min-win, same rule as
    unique_sort's int16 floor). numpy 2.5 eroded the claim's 3.06x plain-
    unique gap to ~1.5x, but the sort kernel gap it rests on GREW: 33x.
  - >-
    Provenance of the ngoldbaum quote above: it is an excerpt from the
    numpy-discussion mailing list, quoted by the reporter inside the issue
    body (posted 2023-09-27, which is the date recorded here; the dump does
    not carry the original listserv post date). The body links the thread
    at
    https://mail.python.org/archives/list/numpy-discussion@python.org/thread/VF43XVYRFWVUVCMOFPEEI73EVUJ6MRVI/.
    It reads as caveats from a maintainer who is otherwise sympathetic
    ("We could probably add a special case"), not as opposition; the issue
    itself has zero comments and no recorded pushback of any kind.
  - >-
    Mechanism, per the same ngoldbaum excerpt: "Looking at a py-spy profile
    of a slightly modified version of the code you shared, it seems the
    difference comes down to NumPy's sorting implementation simply being
    faster for ints than unicode strings. In particular, it looks like
    string_quicksort_<npy::unicode_tag, char> is two or three times slower
    than quicksort_<npy::int_tag, int> when passed the same data." The
    reporter's end-to-end np.unique gap at 10k elements (3.06x derived) is
    consistent with a 2-3x sort-kernel gap plus the surrounding
    unique-machinery overheads.
  - >-
    The transparent fast path this record recommends: when np.unique is
    called (no axis argument) on a native-byte-order U1 or S1 array above
    a calibrated size threshold N*, reinterpret the buffer as integers,
    run np.unique on that, and reinterpret the result back. For U1 the
    view target is int32; numpy orders U1 by its single UCS4 code unit,
    and every valid codepoint (<= 0x10FFFF) is non-negative in int32, so
    the int32 view is a strictly monotone bijection and the unique values,
    counts, indices, and inverse are identical by construction. For S1 the
    view target must be uint8, NOT int8; S1 ordering is unsigned byte
    order, and a signed int8 view would misorder bytes >= 0x80. Exclude
    byte-swapped (non-native endian) dtypes and the axis= path;
    return_counts / return_index / return_inverse pass through unchanged
    because element positions are unaffected by the reinterpretation.
  - >-
    Thread engagement is thin: zero comments, open since 2023-09-27,
    labeled "01 - Enhancement" by melissawm on 2023-10-06, no linked PRs
    anywhere in the dump. The issue title targets the sorting kernel
    itself ("ENH: Sorting single-character arrays (S1 / U1) using integer
    sorting"), so numpy.sort / numpy.argsort on U1/S1 are plausible
    additional beneficiaries of the same view trick, but np.unique is the
    only operation the thread actually measures, hence the single entry in
    affected_operations.
  - >-
    license_review is clean because the candidate is the reporter's own
    three-line pure-numpy snippet posted in the public issue body; no
    external library or vendored code is involved.
  - >-
    What the Dyno reproducer must establish (full spec in
    docs/research/opportunities/OPP-000024.md): the U1/int32 and S1/uint8
    view candidates against stock np.unique across sizes 10 through 1e6,
    return_counts on and off, small and large alphabets, exact-equality
    correctness on every output array, the crossover N* (the thread brackets
    it only between 10 and 10,000), and a separate np.sort-only pair to
    isolate ngoldbaum's 2-3x sort-kernel figure from the unique-level 3.06x.
