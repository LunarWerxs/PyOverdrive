id: OPP-000045
title: "numpy.linalg.det/slogdet/solve on 2x2/3x3 batched stacks: per-matrix LAPACK dispatch (BLAS thread contention) is the reported bottleneck; closed-form cofactor/Cramer vectorization measured 2x-92x depending on op/batch size; sibling of shipped inv_small_batch (OPP-000035)"
sources:
  - url: https://github.com/numpy/numpy/issues/20052
    repository: numpy/numpy
    type: issue
    number: 20052
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T08:10:24Z"
claim:
  speedup: 22.05
  baseline: >-
    Original report (YutoMinami, issue body, 2021-10-06, numpy 1.20.3, Python
    3.7.8): slogdet on a (52,484,484) float array took 1210.36s versus a
    single (484,484) matrix at 3.86s (would predict ~200.7s at 3.86*52,
    actual was ~3x longer); a later re-run of the same shapes could not
    reproduce that ratio either and just showed generally slow, inconsistent
    timings ((1,484,484): 3.99s; two (26,484,484) halves: 126.19s and
    533.30s; full (52,484,484): >1200s). Reproduction attempt without
    OMP_NUM_THREADS pinned (YutoMinami, comment 2021-10-07T04:58:35Z,
    ipython %timeit on a (52,484,484) array, 7 runs of 1 loop each): "3.88 s
    plusminus 367 ms per loop". Two other commenters could NOT reproduce any
    slowness at all on their own (unstated) hardware: rossbar (2021-10-06,
    np.random.random((52,484,484)), %timeit, 7 runs of 1 loop each): "1.31 s
    plusminus 33.1 ms per loop"; bashtage (2021-10-08, positive-definite
    cov_t tiled to (52,484,484)): 0.11s/0.06s/0.07s/0.11s across full array
    and two slices, and on rossbar's exact array: "94.2 ms plusminus 1.35 ms
    per loop" (7 runs, 10 loops each). rossbar's diagnosis (2021-10-06):
    "Whenever there's a case where linalg has poor performance, the first
    thing I suspect is a BLAS threading problem."
  candidate: >-
    YutoMinami, same comment 2021-10-07T04:58:35Z, after setting
    `export OMP_NUM_THREADS=1` in the shell (not via os.environ, which the
    reporter says did not have the same effect): "176 ms plusminus 10.9 ms
    per loop (mean plusminus std. dev. of 7 runs, 10 loops each)". DERIVED
    speedup vs the no-pin case above: 3.88 / 0.176 = 22.045 (~22.05x). This
    is the THREAD'S OWN resolution (an OMP_NUM_THREADS environment
    workaround for BLAS thread oversubscription across many small per-matrix
    LAPACK calls), NOT PyOverdrive's candidate. It is cited here only as
    corroborating evidence that a 3-D stack of small slogdet/det/solve calls
    pays a per-matrix LAPACK dispatch cost that scales badly under threaded
    BLAS; PyOverdrive's actual candidate (closed-form cofactor
    expansion/Cramer's rule, vectorized over the whole stack, never calling
    LAPACK at all) is measured separately under current_numpy_result below.
  hardware: >-
    YutoMinami (comment 2021-10-08T11:39:23Z): OS CentOS Linux release
    7.9.2009 (Core); CPU Intel(R) Xeon(R) Gold 6230 CPU @ 2.10GHz; numpy
    installed via conda, linked against libopenblas.so per ldd output,
    "libopenblas version 0.3.17". Issue body states numpy/Python versions as
    "1.20.3 3.7.8". rossbar's and bashtage's non-reproducing hardware is
    unstated in the dump.
affected_operations: [numpy.linalg.det, numpy.linalg.slogdet, numpy.linalg.solve]
input_regime:
  dtypes: [float64]
  sizes: [100, 1000, 5000, 20000]
  notes: >-
    Targets stacked 2x2 and 3x3 matrices only (d=2 and d=3); single matrices
    and d>3 are out of scope. Standard-normal stacks (dtype not stated
    beyond "standard-normal" in the evidence naming; taken as float64, the
    default of np.random.standard_normal, matching the sibling OPP-000035
    regime). Batch-size behavior differs by operation: det and slogdet (both
    dims) win from batch=100 upward. solve has a floor near batch~1000: at
    batch=100 the 3x3 solve path LOSES to stock (0.81x, see
    current_numpy_result), only turning net-positive by batch=1000 (3.47x
    for 3x3, 9.40x for 2x2); the 2x2 solve does not exhibit the same
    sub-1x floor at batch=100 (2.29x) in the measured data.
