notes:
  - >-
    Comparison mode: numeric, NOT bit-identical. det and solve checked via
    allclose (rtol 1e-9 and rtol 1e-8 respectively); slogdet checked by
    exact sign equality plus logdet allclose. Measured max relative error on
    the contended dev-box triage run was ~2.65e-13 to 3.18e-13 across
    det/solve/slogdet - closed forms (cofactor expansion, sign/log of the
    closed-form determinant, Cramer's rule) are algebraically exact but
    accumulate different floating-point rounding than per-matrix LAPACK
    factorization, so exact bit-identity is not the correctness bar here;
    slogdet signs must still match exactly.
  - >-
    This issue (numpy/numpy#20052, "BUG: numpy.linalg.slogdet is very
    slow") is used as THREAD EVIDENCE for the underlying pain point, not as
    a prior claim of the closed-form technique itself: nobody in the thread
    proposes cofactor/Cramer vectorization. The reporter's own inconsistent,
    slow batched-slogdet timings on a (52,484,484) stack, and rossbar's
    diagnosis that "the first thing I suspect is a BLAS threading problem,"
    point at the same root mechanism this opportunity targets: numpy's
    stock 3-D linalg gufunc loop dispatches one LAPACK call per matrix in
    the stack, and under threaded BLAS that per-matrix dispatch pattern
    causes thread oversubscription/contention that scales worse than
    linearly with batch size. The reporter's own fix was an
    OMP_NUM_THREADS=1 environment workaround (~22.05x per the claim above),
    not a code change; the issue was closed by the reporter as resolved
    without any maintainer patch or linked PR. A closed-form batched
    vectorization sidesteps the mechanism entirely by never calling LAPACK,
    so it is not subject to BLAS thread contention at all.
  - >-
    Two of five commenters (rossbar, bashtage) could NOT reproduce the
    reported slowness on their own hardware at all, underscoring that the
    behavior is threading/contention-dependent rather than a fixed
    per-call numpy cost - consistent with this being a dispatch-overhead
    problem rather than an algorithmic bug, and consistent with why no
    maintainer fix was ever proposed in this thread.
  - >-
    Sibling of the SHIPPED inv_small_batch adjugate path (OPP-000035,
    numpy/numpy#17166): same family of small-matrix batched linalg ops
    (2x2/3x3), same reasoning that pay-per-matrix LAPACK dispatch loses to
    a closed-form vectorized route once batch size is large enough. The
    same det-magnitude well-conditioning guard that OPP-000035's shipped
    path uses must apply here: near-singular matrices lose accuracy under
    Cramer's rule, and stock numpy raises LinAlgError on an exactly
    singular matrix while the closed forms (cofactor det, Cramer solve)
    would instead divide by a near-zero determinant, so a det-magnitude
    guard must refuse ill-conditioned stacks (falling back to stock) exactly
    as the shipped inv_small_batch path does.
  - >-
    license_review clean: cofactor expansion (for det), sign/log of the
    closed-form determinant (for slogdet), and Cramer's rule (for solve) are
    textbook linear-algebra formulas with no third-party or reporter-owned
    code to review, unlike threads with posted third-party snippets.
  - >-
    correctness_risk medium: near-singular input matrices lose accuracy
    under Cramer's rule (ill-conditioning amplifies rounding error in the
    closed forms), and the divide-by-determinant failure mode differs from
    stock's LinAlgError-on-exactly-singular behavior - both reasons a
    det-magnitude well-conditioning guard is required before dispatching to
    the fast path, per the OPP-000035 precedent above. implementation_risk
    low: the formulas are fixed-size, branch-free, and directly vectorizable
    with no iterative/data-dependent control flow.
  - >-
    SHIPPED (2026-08-24) as det_small_batch + slogdet_small_batch + solve_small_batch (src/pyoverdrive/fastpaths/linalg_small_batch.py): float64 (...,2,2)/(...,3,3) stacks, batch floors one measured notch above the 1.3x crossing (det 2x2 100 / 3x3 300, slogdet same, solve 300/1000) because the predicate re-derives det for inv_small_batch's DET_RTOL=1e-8 conditioning guard. slogdet returns stock's namedtuple type with exactly-equal signs. Numeric mode. 23 differential tests plus a property suite.
