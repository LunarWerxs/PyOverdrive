claim:
  speedup: null
  baseline: >-
    No numpy benchmark appears anywhere in the thread. Numpy's current
    behavior for C @ R (a complex-valued MxN matrix times a real-valued NxQ
    matrix) is implied only by the reporter's framing: numpy presumably
    promotes the real operand R to complex and dispatches to a single
    complex GEMM. No %timeit output, code snippet, matrix sizes, dtypes,
    numpy version, or hardware for this baseline appear in the issue body
    or its one comment.
  candidate: >-
    Also unmeasured. The reporter's proposal, quoted verbatim from the issue
    body: "it should be possible to perform the C @ R operation between the
    two matrices using one strided GEMM call, exploiting the contiguous
    nature of the real and imaginary parts." No implementation, pseudocode,
    or benchmark is posted. The reporter's only follow-up comment
    (2023-09-02) states: "I've had a brief look at the ufunc machinery and
    couldn't see a simple way to implement this, the operands are directly
    coerced to a common type and there seems to be no way to define a
    custom C function for a given LHS+RHS pair. Any idea?" - unanswered.
    The only number anywhere in the thread is a hedged, unattributed aside
    in the issue body: "I suppose MATLAB is performing something similar as
    I've noticed a 2x difference in execution time between `C * R` and
    `(R' * C')'`." This is deliberately NOT adopted as claim.speedup: the
    sentence never names which library (numpy or MATLAB) the "2x" was
    measured in, carries no code, sizes, dtypes, or hardware, and compares
    two different expressions (C*R vs the transposed-trick (R'*C')') rather
    than timing the proposed single-strided-GEMM candidate directly.
  hardware: >-
    unknown; the thread gives no CPU, OS, numpy version, or Python version
    anywhere in the issue body or its one comment.
