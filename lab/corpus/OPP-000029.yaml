  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0% load): the split-GEMM route is REAL but its regime is
    narrow and shape-inverted from naive expectation. On most measured
    shapes stock's upcast-then-complex-GEMM WINS on this box (split at
    0.36-0.84x for square/tall C in complex128; OpenBLAS's zgemm is
    strong and the strided .real/.imag views tax the real GEMMs), but
    when C is short against a large R - (64,2000)@(2000,2000) - the
    upcast copy of R dominates stock and split wins 3.08x (c128) and
    3.16x (c64). Reverse direction R@C is a mild 1.17-1.18x. BATCH4-CAL
    sweeps m x n x q to establish whether the winning regime is crisp
    enough to ship; verdict pending that battery. Evidence:
    benchmarks/results/OPP-000029/9bbe7063c555.json.
