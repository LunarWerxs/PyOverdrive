notes:
  - >-
    SHIPPED (2026-08-24) as matmul_split_complex
    (src/pyoverdrive/fastpaths/matmul_split_complex.py): matmul(C, R)
    for 2-D complex128+float64 / complex64+float32 pairs with
    m <= 256, n >= 1000, q >= 500, both operands all-finite (the split
    changes non-finite propagation; same guard class as dot_mixed_view/
    OPP-000027). Regime from BATCH4-CAL: every measured cell in that box
    wins 1.55-7.5x (the upcast copy of R dominates stock there), while
    square/tall C measured 0.36-0.84x and stays on stock - the m <= 256
    bound is a measured cell edge, not an extrapolation. Reverse
    direction R@C measured 1.17-1.18x (below min-win), unshipped.
    license_review clean: identity decomposition from first principles,
    no thread code existed to reuse.
  - >-
    Mechanism, as the thread states it (issue body, LemonBoy, 2023-08-28):
    "it should be possible to perform the C @ R operation between the two
    matrices using one strided GEMM call, exploiting the contiguous nature
    of the real and imaginary parts." The reporter frames this as analogous
    to MATLAB: "I suppose MATLAB is performing something similar as I've
    noticed a 2x difference in execution time between `C * R` and
    `(R' * C')'`." No mechanism detail beyond this one sentence is given;
    there is no discussion of how the strided GEMM call would be issued
    (one BLAS call vs two), memory layout requirements, or how the result
    would be reassembled into a complex array.
  - >-
    Transparent fast-path sketch (not implemented, drafted for this
    record only). PREDICATE: a matmul-shaped call where one operand's
    dtype is a numpy complex type (complex64/complex128) and the other is
    a real floating type (float32/float64), both operands finite, shapes
    valid for 2-D matrix multiplication. ROUTE: split the complex operand
    C = Cr + i*Ci into its contiguous real and imaginary views, run two
    real GEMMs (Cr @ R and Ci @ R), recombine as (Cr @ R) + i*(Ci @ R).
    Coverage gap that must be stated plainly: PyOverdrive patches
    module-level numpy names only, so a call written as np.matmul(C, R)
    is reachable and patchable, but the @ operator (which invokes
    ndarray.__matmul__ directly) and any ndarray method form such as
    C.dot(R) are NOT reachable by a module-level monkeypatch. This matters
    concretely here because every example in the issue itself is written
    in the unreachable operator form ("C @ R", "C * R", "(R' * C')'"), not
    as numpy.matmul(...) calls.
  - >-
    Semantics hazard: splitting a complex GEMM C @ R into two real GEMMs
    (real(C) @ R and imag(C) @ R, recombined as real + i*imag) changes how
    IEEE-754 non-finite values propagate compared to a single native
    complex GEMM, because complex multiply-accumulate mixes real and
    imaginary cross terms within one operation, and exactly those cross
    terms are what the split discards. PyOverdrive's own shipped
    dot_mixed_view fast path (see related_opportunities OPP-000027) hit
    this precise hazard and refused to run on any operand containing
    non-finite (inf/nan) values for exactly this reason. That shipped
    precedent is why correctness_risk is recorded as high here, even
    though this numpy thread itself never mentions inf, nan, or
    correctness anywhere - the hazard is inferred from PyOverdrive's own
    prior experience with the same class of decomposition, not from any
    statement in the thread.
  - >-
    Implementation risk, from the reporter's own (non-maintainer)
    investigation, comment of 2023-09-02: "I've had a brief look at the
    ufunc machinery and couldn't see a simple way to implement this, the
    operands are directly coerced to a common type and there seems to be
    no way to define a custom C function for a given LHS+RHS pair. Any
    idea?" This went unanswered. It describes a structural obstacle inside
    numpy's own ufunc dispatch (not a PyOverdrive-specific concern), which
    is why implementation_risk is recorded as high.
  - >-
    maintainer_objections is empty because no numpy maintainer ever
    commented on this thread. author_association is "NONE" for both the
    issue and its single comment, and both are from the same user
