  - author: seberg
    quote: >
      I have to admit I am a bit fatalistic these days because speed
      fluctuations do not always seem to have obvious code reasons (I blame
      compiler optimization variations, etc.).
  - author: seberg
    quote: >
      I am not immediately sure whether its reasonable to do in NumPy or
      should definitely be only considered in BLAS (here openblas I guess).
  - author: seberg
    quote: >
      If there is an argument that we should give it a shot in NumPy, that
      seems fine by me, it doesn't sound like it should slow down things
      measurably if its unnecessary and it seems to help BLAS a lot in some
      cases...
  - author: seberg
    quote: >
      But I expect a few code paths may need the memset anyway, which
      probably is why its there (i.e. if the inputs have 0-size or if the
      NumPy slow fallback is used).
  - author: bmerry
    quote: >
      So far the slowdowns are generally much less significant than the
      speedups, but we've still only sampled a tiny part of the
      multi-dimensional problem space. If you feel that this is a risky
