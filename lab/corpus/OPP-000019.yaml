notes:
  - "Root cause per bmerry's own investigation, confirmed by comment-out testing: np.dot's internal cblasfuncs.c path unconditionally memsets the out buffer before the CBLAS call; np.matmul's matmul.c.src path does not, so with beta=0 GEMM calls, an out= array that is still copy-on-write/unfaulted forces page faults during the multi-threaded GEMM call itself, which the author attributes to lock contention across OpenBLAS threads during concurrent faulting."
  - "The 5.94x figure (213.9 / 36.0 GFlops) is matmul-vs-itself with only the out buffer's fault state changed, which is the cleanest apples-to-apples number in the thread; the issue's own headline comparison (matmul 36.0 GFlops vs dot 87.7 GFlops, i.e. dot 2.44x faster) mixes two different code paths and is the more commonly quoted number but a less clean isolation of the mechanism."
  - "This is unusually undecided for a lead: the reporter's own final comment offers to let the issue be closed ('risky change for dubious reward'), the issue carries a '57 - Close?' triage label, and it has stayed open with no resolution since 2021; treat this as weaker evidence than OPP-000007, not a settled optimization."
  - "linked_prs is empty because no numpy PR is referenced anywhere in the thread; the only cross-reference is bmerry's own follow-up issue on the OpenBLAS tracker (https://github.com/xianyi/OpenBLAS/issues/3197), which is a bug report against OpenBLAS itself, not a fix attempt in numpy."
  - "Proposed transparent fast path for PyOverdrive: predicate on np.matmul(a, b, out=c) calls where c is a large (multi-page), freshly-allocated ndarray about to be passed into a threaded-BLAS GEMM call; route to a one-touch-per-page prefault of c (not a full memset, per seberg's own suggestion to only touch page-size strides) immediately before dispatch. Semantics are unchanged: beta=0 in the GEMM call means c is write-only, never read, so prefaulting cannot alter the numeric result, only when the pages get zero-cost-faulted. The open question the reproducer must answer is whether the win generalizes past this one shape/dtype/thread-count, since bmerry's own later benchmarking called the effect complicated and system-dependent with occasional net losses."
