notes:
  - >-
    SHIPPED (2026-08-24) as dot_mixed_view
    (src/pyoverdrive/fastpaths/dot_mixed_view.py): dot(A f64 2-D,
    b complex128 1-D contiguous), A.size >= 20k, all-finite both
    operands, routed through the view-as-real GEMV (b viewed as (m,2)
    real, one real matmul via the unpatchable @ operator, result viewed
    back). 34.9x end-to-end at 200x100 smoke. The finiteness guards are
    measured necessities, found by the differential battery: stock's
    complex GEMV multiplies by A's zero imaginary part (0*inf -> NaN in
    both components) and BLAS's complex multiply mixes components (a
    lone inf in A became NaN on stock); the clean real route produces
    neither, so non-finite inputs stay on stock for exact parity.
  - >-
    Demand signal is thin in the dump: one maintainer comment (seberg,
    MEMBER, 2018-01-26), zero reactions, no labels, no linked PRs, and no
    activity recorded after 2018-01-26, though the issue is still open at
    retrieval (2026-08-24). Counterweight: the reporter states the behavior
    "persists across different installations on different operating systems
    with different BLAS/LAPACK setups", and seberg's independent timings
    confirm the same slow-case pattern on a third machine.
  - >-
    Full derivation table from the thread's verbatim per-loop timings
    (Ar.dot(Br) / A.dot(Br) / A.dot(B) / Ar.dot(B)). Reporter MKL box:
    1.29 / 2.41 / 2.54 / 110 ms, so the slow case is 85.27x the real-real
    product (110 / 1.29) and 43.31x the complex-complex product
    (110 / 2.54). Reporter macOS Accelerate box: 5.01 / 18.8 / 18.8 /
    116 ms, so 23.15x real-real and 6.17x complex-complex. seberg's box:
    2.57 / 5.54 / 5.54 / 23.2 ms, so 9.03x and 4.19x. The reporter's
    "10-50x" headline is their own summary across pairings and machines,
    not a single measured ratio.
  - >-
    The thread does not diagnose the mechanism beyond seberg's casting
    observation. seberg's added timings show the pieces of a
    cast-then-complex-dot route on his machine: A.astype(np.complex128)
    23.1 ms, Ac[...] = A (assignment into a preallocated complex array)
    12 ms, complex dot 5.54 ms. On his box astype + dot (28.6 ms) would
    actually LOSE to the 23.2 ms slow path, while assign + dot (17.5 ms)
    would win modestly; on the reporter's MKL box even a pessimistic
    upcast cost plus the 2.54 ms complex dot is several times faster than
    the 110 ms slow path. The obvious inference (ours, not the thread's)
    is that numpy is not reaching BLAS at all for real-left-complex-right
    dot and is instead in a buffered non-BLAS fallback loop, but the
    thread never establishes this; the Dyno reproducer must profile which
    it is on current numpy before any fast path is designed.
  - >-
    The transparent fast-path shape this record recommends measuring, not
    the only one: for np.dot with a real float left operand and a complex
    right operand (the measured slow direction), view the contiguous
    complex operand's buffer as a real array with a trailing axis of 2
    (interleaved re/im), run ONE real BLAS product against it (DGEMM on
    (n, m) x (m, 2) for the thread's matvec case), and view the (n, 2)
    result as complex128. Same multiplications as the upcast route, no
    complex arithmetic, no upcast copy of the large matrix, and roughly
    twice the real-real work, which against the thread's MKL numbers
    predicts ~2.6 ms vs 110 ms. The fallback candidate is the simpler
    upcast-then-complex-dot, which the thread itself measures as 43.31x
    (upcast cost excluded).
  - >-
    Correctness risk is rated low because the split-real route performs
    algebraically identical component arithmetic to the upcast route
    (real times complex is componentwise scaling); the residual hazards
    are summation-order differences versus whatever loop stock numpy uses
    (tolerance-level, same class as any BLAS rerouting), sign-of-zero and
    NaN/inf propagation patterns when the implicit zero imaginary part is
    eliminated, mixed-precision pairings (float64 with complex64) whose
    promotion must match numpy exactly, and non-contiguous complex
    operands whose buffers cannot be reinterpreted without a copy. All
    are differential-testable. Implementation risk is medium because
    np.dot dispatch is core-path interception.
  - >-
    Related to OPP-000002 (np.inner ndim>2 routed via tensordot to BLAS)
    as the same mechanism class: an input regime that BLAS could serve
    directly but where numpy's dispatch falls back to a slower
    direct-computation path, fixable by rerouting rather than by new
    kernels.
