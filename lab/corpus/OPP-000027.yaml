id: OPP-000027
title: "A.dot(B) 10-50x slower when A is real and B is complex than every other real/complex pairing of the same product"
sources:
  - url: https://github.com/numpy/numpy/issues/10468
    repository: numpy/numpy
    type: issue
    number: 10468
    state_at_ingestion: open
    retrieved_at: "2026-08-24T03:32:50+00:00"
claim:
  speedup: 43.31
  baseline: >-
    Ar.dot(B), a real-by-complex matrix-vector product with Ar =
    A.real.copy() a (10000, 1000) float64 matrix and B a (1000,) complex128
    vector, timed by the reporter (dbstein) at 110 ms per loop on their 16
    core Intel MKL machine and 116 ms per loop on their 2 core macOS
    Accelerate laptop. The reporter's headline framing is that this case is
    "very slow ... (10-50x compared to A real/B real, A complex/B complex,
    and A complex/B real)" and that "The behavior persists across different
    installations on different operating systems with different BLAS/LAPACK
    setups."
  candidate: >-
    A.dot(B), the identical product with the left operand already complex128
    (i.e. the result of upcasting Ar to complex before the dot), timed by
    the reporter at 2.54 ms per loop on the same MKL machine. The 43.31
    figure is DERIVED, not quoted: 110 / 2.54 = 43.31, from the reporter's
    own two timings on the MKL box, and it excludes the one-time upcast cost
    (the reporter never timed the astype; seberg later timed
    A.astype(np.complex128) at 23.1 ms per loop on a third, different
    machine). It sits inside the reporter's own 10-50x headline range. The
    same derivation gives 116 / 18.8 = 6.17x on the reporter's macOS laptop
    and 23.2 / 5.54 = 4.19x on seberg's machine, so 43.31 is the largest
    thread-supported ratio for this comparison, not a universal figure.
  hardware: >-
    Two machines, both the reporter's (dbstein, 2018-01-25): a "2 core
    laptop with MAC OSX 10.12.6, python version 2.7.14 (Anaconda), and
    numpy version 1.14.0 linked against the Accelerate framework" (5.01 /
    18.8 / 18.8 / 116 ms per loop for real-real, complex-real,
    complex-complex, real-complex respectively), and a "16 core machine
    with CentOS 7.4.1708, python version 2.7.14 (Intel Corporation), and
    numpy version 1.13.3 linked against Intel MKL" (1.29 / 2.41 / 2.54 /
    110 ms per loop, same order). No CPU model is given for either.
    seberg's follow-up machine (2018-01-26) is entirely unspecified
    (2.57 / 5.54 / 5.54 / 23.2 ms per loop, same four cases).
affected_operations: [numpy.dot]
input_regime:
  dtypes: [float64, complex128]
  sizes: ["(10000, 1000) x (1000,)"]
  notes: >-
    Matrix-vector product (GEMV shape) only; no matrix-matrix case was
    timed in the thread. All three measurement sets cover the same four
    dtype pairings on the same shapes, and all three agree on the
    asymmetry: complex.dot(real) (A.dot(Br)) is roughly as fast as the
    all-complex product (2.41 vs 2.54 ms on the MKL box), while
    real.dot(complex) (Ar.dot(B)) is the one slow case (110 ms there).
    So the slow regime is specifically a real left operand with a complex
    right operand, where the operand that would need upcasting is the
    large matrix rather than the small vector.
status: performance_validated
license_review: pending
reproducer: benchmarks/historical/opp_000027_dot_real_complex.py
current_numpy_result:
  verified_speedup: 43.84
  fingerprints: [9bbe7063c555]
  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0% load): REPRODUCED, and the winning route is NOT the
    thread's. Upcasting the real operand first (the issue's own
    suggestion) measures ~1x here (0.88-1.13x: numpy 2.5 already
    upcasts internally). The win is viewing the complex vector as an
    interleaved real matrix and doing one real GEMV: 43.84x at 200x100
    (smoke) and 12.05x at 10000x1000 for real-matrix @ complex-vector.
    The reverse direction (complex @ real) shows no gap (0.96-1.05x),
    so any fast path is one-sided. Evidence:
    benchmarks/results/OPP-000027/9bbe7063c555.json.
