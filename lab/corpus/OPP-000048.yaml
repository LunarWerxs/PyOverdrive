  detail: >
    Full Dyno runs 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0-1% load), symmetric standard-normal stacks, numeric
    comparison at the scaled absolute tolerance (1e-9 f64 / 1e-3 f32).
    GUARDED end-to-end candidate (isfinite scan included,
    benchmarks/results/BATCH7-CAL/9bbe7063c555.json):
    float64 - batch=100: 1.21x, 300: 2.57x, 1000: 4.36x, 10000: 3.73x,
    100000: 2.85x. float32 - 100: 1.20x, 300: 2.50x, 1000: 4.28x,
    10000: 3.38x, 100000: 2.84x.
    Ill-conditioned witness (eigenvalue spread 1e12, which contains a
    coalesced pair): 0.85x - the DEGENERACY_MIN bail fires, pays its
    wasted partial compute, and returns stock's own result; correctness
    check passes at the full 1e-9 tolerance because the output IS
    stock's.
    RAW algorithm (reproducer, benchmarks/results/OPP-000048/): 1.36x at
    100, 4.51x at 1000, 4.05x at 10000, 2.69x at 100000. Dev-box probe
    (AMD Zen 4, numpy 2.4.5, contended): 1.41x at 100, 7.06x at 1000,
    5.38x at 10000, 4.30x at 100000; max error 9.3e-14 of scale on
    random stacks.
