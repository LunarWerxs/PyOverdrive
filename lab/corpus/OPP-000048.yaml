notes:
  - >-
    Comparison mode: numeric at the absolute-error-vs-||A|| standard,
    same as OPP-000030. Random-stack battery cells measured ~1e-15 of
    scale; float32 input is computed in float64 and cast back, so its
    delivered accuracy is at least stock's own f32 LAPACK path.
  - >-
    The near-degenerate bail is the load-bearing correctness decision of
    this record. The trig form's root separation enters through
    phi = arccos(r)/3 with d(phi)/d(r) = 1/(3*sqrt(1-r^2)); as a pair of
    eigenvalues coalesces r -> +/-1 and the ~eps error in
    r = det(B)/2 is amplified without bound, measured at 1.6e-8*scale on
    diag(1, 1+1e-9, 5) against LAPACK's ~1e-15. Rather than shipping a
    weaker promise for that input class, _run detects
    1 - r^2 < DEGENERACY_MIN = 1e-12 (keeping amplification under ~3e2,
    a 10x margin against the 1e-9 contract) and hands the WHOLE stack to
    stock via the graceful-fallback/StockRaised pattern. Exactly-equal
    spectra (p == 0, e.g. c*I) are NOT degenerate for this purpose: all
    roots collapse to q exactly and stay on the fast path.
  - >-
    The final 3-element in-place sort exists because the roots emerge
    mathematically ordered but rounding near (admitted) close pairs can
    invert one by an ulp, and stock's ascending order is documented
    contract.
  - >-
    license_review clean: the trigonometric cubic solution is classical
    textbook mathematics (Smith 1961 form); no third-party code.
  - >-
    correctness_risk medium: the sqrt(eps) degradation described above is
    real and was CAUGHT by this project's own property net (the clustered
    hazard failed on the second machine before the bail existed) - the
    bail turns it from a silent accuracy regression into a refusal.
    implementation_risk low: branch-free vectorized formulas plus one
    any() reduction for the bail.
  - >-
    SHIPPED (2026-08-24, batch 7) as eigvalsh_3x3_trig
    (src/pyoverdrive/fastpaths/eigvalsh_3x3.py): float64/float32
    (...,3,3) stacks, BATCH_MIN=300, UPLO='L' only, isfinite-guarded,
    DEGENERACY_MIN bail. 22 differential tests plus a property net with
    UPLO / clustered / identity-multiple / NaN / asymmetric-upper
    hazards.
  - >-
    BATCH 9 SPLIT-AND-RECOMBINE (2026-08-24): the near-degenerate bail no
    longer punishes a whole stack for a few coalesced pairs - cells
    failing the 1 - r^2 >= DEGENERACY_MIN test are gathered, served by
    stock, and scattered back into the trig result; only past
    DEGEN_FRAC_MAX = 0.25 degenerate does the whole stack go to stock in
    one batched call (the gathered subset pays stock's per-matrix LAPACK
    dispatch, so past ~a quarter the one batched call is cheaper).
    BATCH9-CAL idle-box cells (fp 9bbe7063c555, 0% load, n=10_000): 3.90x
    at 0% degenerate, 3.76x at 0.1%, 3.70x at 1%, 3.03x at 10%, 2.33x at
    25%, 0.92x at 50% (the ceiling protects exactly this loss);
    n=100_000: 2.86-2.92x at 0-1%, 2.47x at 10%. Dev box agrees
    (3.2-3.8x at 0.1-10%, ~1.2x at 50%). float32 degenerate cells are
    served by stock's own float32 route and survive the f32->f64->f32
    roundtrip exactly. Previously any single degenerate cell collapsed
    the stack to ~1.0x (whole-batch stock).
