id: OPP-000048
title: "numpy.linalg.eigvalsh on 3x3 batched stacks: per-matrix LAPACK syevd dispatch loses to the vectorized trigonometric closed form (2.5-4.5x from batch 300, f64 and f32); d=3 sibling of the shipped eigvalsh_2x2_closed (OPP-000030), with a mid-run bail to stock on near-degenerate spectra where the trig form degrades to sqrt(eps)"
sources:
  - url: https://github.com/numpy/numpy/issues/22158
    repository: numpy/numpy
    type: issue
    number: 22158
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T09:08:03Z"
claim:
  speedup: null
  baseline: >-
    Same source thread as OPP-000030 (numpy/numpy#22158, "BUG:
    numpy.linalg.eigh slower than numpy.linalg.eig when broadcasting small
    matrices", javierttgg, 2022-08-20, closed 2022-09-02): batched
    small-matrix eigh routes each matrix through a per-matrix LAPACK call
    whose setup overhead dominates the actual eigen-work at d=2/d=3
    (seberg's in-thread analysis). The thread reports the eigh-vs-eig
    anomaly; it contains no closed-form candidate and no 3x3-specific
    numbers, so no prior speedup is claimed here.
  candidate: >-
    PyOverdrive's candidate (not from the thread): the classical
    trigonometric solution of the symmetric 3x3 characteristic cubic
    (Smith 1961 form) - shift by q = tr(A)/3, scale by
    p = sqrt(tr((A-qI)^2)/6), roots q + 2p*cos(arccos(det(B)/2)/3 +
    2k*pi/3) - vectorized across the whole stack, never calling LAPACK.
    Values-only surface (eigvalsh), for the same reason OPP-000030 stayed
    values-only: eigenvectors carry a LAPACK sign convention that blocks
    a comparison contract.
  hardware: unknown (none stated in the thread for the d=3 case)
affected_operations: [numpy.linalg.eigvalsh]
input_regime:
  dtypes: [float64, float32]
  sizes: [300, 1000, 10000, 100000]
  notes: >-
    Stacked symmetric 3x3 only, UPLO='L' (stock's default read triangle),
    all-finite, batch >= 300. Two carve-outs measured and enforced:
    batches under 300 lose to the dispatch-plus-guard cost (1.20-1.21x at
    100, under the 1.3x bar), and NEAR-DEGENERATE spectra (any matrix
    whose scaled cubic has 1 - r^2 < 1e-12, i.e. a coalescing eigenvalue
    pair) bail to stock mid-run because the arccos derivative amplifies
    the ~eps error of r without bound as r -> +/-1, degrading delivered
    accuracy to ~sqrt(eps)*scale (measured 1.6e-8 absolute on
    diag(1, 1+1e-9, 5)) where LAPACK keeps eps-grade.
