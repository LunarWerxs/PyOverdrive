id: OPP-000053
title: "numpy.linalg.qr on 2x2/3x3 stacks pays per-matrix LAPACK dispatch (dgeqrf + dorgqr per tiny matrix) inside its gufunc loop - unrolled Householder reflectors in LAPACK's own dlarfg sign convention reproduce stock's Q and R to ~1e-15 WITH matching signs and win 1.8-11x"
sources:
  - url: https://github.com/numpy/numpy/issues/7179
    repository: numpy/numpy
    type: issue
    number: 7179
    state_at_ingestion: open
    retrieved_at: "2026-08-24T21:30:00Z"
claim:
  speedup: null
  baseline: >-
    jcrist (issue body, 2016-02-03): "Currently, calls to routines in
    np.linalg don't release the interpreter lock, but (as far as I can
    tell) should be able to. This has caused non-optimal behavior for
    dask.array.linalg... when trying to use these functions in parallel
    using threads." In-thread timing: one qr of a 2000x2000 at 884 ms
    wall, two mapped across a ThreadPool at 1.61 s - no thread scaling.
    seberg (2016-02-05): "You can try gh-7198 if you like. Ironically,
    QR is _not_ part of it, because unlike most of the functions, it is
    not a generalized ufunc...."; seberg (2018-05-17, retitling the
    issue): "I think QR still is not a gufunc, and it would probably be
    nice if it was, so renaming the issue into that."
  candidate: >-
    The literal gufunc ask landed in numpy 1.22 (qr_reduced,
    qr_complete, qr_r_raw exist in numpy 2.x _umath_linalg), but the
    gufunc inner loop still makes per-matrix LAPACK calls - dgeqrf, then
    dorgqr to form Q - whose setup overhead dominates at d in {2, 3},
    the same per-matrix-dispatch class as the eigvalsh and cholesky
    small-batch families (OPP-000030/000047/000048). PyOverdrive's
    candidate unrolls the Householder factorization (one reflector for
    d=2, two for d=3) in dlarfg's exact convention: beta =
    -sign(alpha)*hypot(alpha, xnorm) when the below-diagonal part is
    nonzero, tau = 0 / beta = alpha (identity reflector) when it is
    exactly zero - so the per-column SIGNS, which are the only freedom
    in the factorization, match stock's by construction.
  hardware: "jcrist's 2016 timing hardware unstated in-thread."
affected_operations: [numpy.linalg.qr]
input_regime:
  dtypes: [float64]
  sizes: [100, 300, 1000, 3000, 10000, 100000, 1000000]
  notes: >-
    qr(a) / qr(a, mode) / qr(a, mode=...) with mode in {'reduced',
    'complete', 'r'} (square input makes reduced and complete coincide),
    a a plain float64 (..., d, d) stack, d in {2, 3}, batch >=
    {2: 100, 3: 300}, all-finite. mode='raw', other dtypes, non-square,
    and non-finite input refuse to stock. Q-modes return stock's
    QRResult namedtuple; 'r' the plain ndarray. d=3 only: matrices
    whose trailing block after the first reflector falls inside the
    QR_RTOL determinism band (rank-deficient / repeated-column input,
    where dlarfg's discontinuities let two valid factorizations
    disagree at full scale) are split out mid-run and served by stock,
    scattered back - whole stack to stock past QR_BAD_FRAC_MAX. The
    first reflector reads raw input bits, so d=2 needs no band.
