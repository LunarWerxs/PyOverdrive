main_branch_result: null
correctness_risk: medium
implementation_risk: low
notes:
  - >-
    The sign contract is the whole path: qr's factors are unique only
    up to per-column signs, so serving qr means reproducing LAPACK's
    dlarfg choices exactly, not producing "a valid QR". Measured
    agreement |dQ| <= 8.7e-15, |dR| <= 9.3e-16 of scale across random,
    negative-lead, already-triangular (tau = 0 branch), zero-first-
    column, and all-zero inputs.
  - >-
    correctness_risk medium is the d=3 second reflector: its inputs
    (b22, b32) are COMPUTED, carrying ~eps*scale noise, and dlarfg is
    discontinuous at b32 == 0 (identity vs near-flip) and in
    sign(b22) (copysign) - noise-grade trailing blocks let the two
    routes return sign-flipped R rows and O(1)-different Q columns,
    both valid, violating agreement-with-stock. Handled by the QR_RTOL
    = 1e-6 band (caps route divergence at ~eps/1e-6 = 2e-10, inside
    the 1e-9 contract) with split-and-recombine (eigvalsh_3x3
    precedent): trippers are gathered, served by stock, scattered
    back. A whole-stack bail was tried first and REJECTED by the
    battery: random Gaussian stacks trip the band with probability
    ~1e-5 per matrix, so a million-matrix stack almost surely
    contains one and the large-n regime would have collapsed to stock.
  - >-
    license_review clean: Householder QR and the dlarfg conventions are
    textbook/LAPACK-documented algorithms; formulas re-derived, no
    third-party code.
  - >-
    SHIPPED (2026-08-24, batch 10) as qr_small_batch
    (src/pyoverdrive/fastpaths/qr_small_batch.py): 36 differential
    tests plus a property net with triangular/zero-column/all-zero/
    rank-1/non-finite/f32/mode-spelling hazards.
