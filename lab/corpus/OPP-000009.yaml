id: OPP-000009
title: "poor free-threaded (nogil) multithreaded scaling for repeated small-array ufunc workloads"
sources:
  - url: https://github.com/numpy/numpy/issues/27786
    repository: numpy/numpy
    type: issue
    number: 27786
    state_at_ingestion: closed
    retrieved_at: "2026-08-23T08:01:35Z"
claim:
  speedup: 60.0
  baseline: "numpy elementwise + reduction ops (x += 0.01; x[0] += x.mean() * 0.01) run on many concurrent threads under a free-threaded (PYTHON_GIL=0 / nogil) CPython 3.13 build, small float64 arrays (length ~100-1000)"
  candidate: "the same per-worker workload rewritten with plain Python lists (no numpy), which keeps scaling roughly linearly as thread count grows"
  hardware: "AMD Ryzen Threadripper PRO 5955WX 16-core (original reporter, eundersander); reproduced on Apple MacBook Pro M3 Max, 11 logical CPUs (ngoldbaum)"
affected_operations: [numpy.ufunc dispatch/type-resolution cache, numpy.ndarray.__iadd__, numpy.mean, numpy.sum]
input_regime:
  dtypes: [float64]
  sizes: [100, 1000]
  notes: >
    many concurrent threads (8 up to 2048 in the reporter's sweep) each
    operating on a small array under a free-threaded (nogil) CPython build;
    the collapse is a fixed per-call overhead (a globally locked ufunc
    identity/type-resolution cache) that dominates once array length is
    small and thread count is high. Not applicable under a standard GIL
    build, where only one thread executes Python/C bytecode at a time and
    this contention path is never exercised.
status: unverified
