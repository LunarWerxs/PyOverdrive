  verified_speedup: null
  fingerprints: []
main_branch_result: null
correctness_risk: unknown
implementation_risk: low
maintainer_objections:
  - author: mattip
    quote: "are you controlling for the OpenBLAS threading underneath NumPy? You might want to use threadpoolctl or set OMP_NUM_THREADS=1"
  - author: colesbury
    quote: "readers-writer locks don't necessarily scale that well, even for read-only workloads, because of contention on the count of the number of readers; it's also not part of the public Python C API or the C standard library"
  - author: seberg
    quote: "I could imagine that having a custom hashmap is just too terrible in a free-threaded world"
  - author: ngoldbaum
    quote: "if you have a cache miss and lots of threads are doing similar ufunc operations then you're almost certain to have races inside promote_and_get_ufuncimpl outside of the custom hashmap implementation"
