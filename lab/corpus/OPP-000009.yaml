notes:
  - "Free-threaded (nogil, PYTHON_GIL=0) CPython only; a standard GIL build never exercises this contention path since only one thread runs Python/C bytecode at a time, so this opportunity is irrelevant unless PyOverdrive targets free-threaded CPython specifically."
  - "Already fixed upstream: root cause traced by ngoldbaum via flamegraph to a locked ufunc identity/type-resolution cache in numpy/_core/src/umath/dispatching.c (promote_and_get_info_and_ufuncimpl); fixed by #27859 and #27896/#27913 (fast path for ufunc type resolution), which then required deadlock follow-up fixes #28577/#28583 for the C++ shared-mutex based dispatch cache. Check whether PyOverdrive's baseline numpy version predates these fixes (merged Nov-Dec 2024, first appearing in a 2.2.x/2.3.x release) before treating this as still open."
  - "Reproducer precondition not met on this machine: requires a free-threaded 3.13t/3.14t CPython build (python.org 'experimental free-threading build' or python-build-standalone with +freethreaded); this workstation runs GIL CPython 3.14.2. Per assignment, reproducer skipped; record and report only."
  - "python-pillow/Pillow#8714 ('Reduce memory arena contention') is cross-referenced as the same failure shape recurring elsewhere in the free-threading ecosystem (global lock contention on a shared cache/allocator under nogil), not a fix for numpy itself."
