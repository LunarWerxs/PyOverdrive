related_opportunities: [OPP-000002]
notes:
  - >-
    EXTENDED (2026-08-23, same day): mode='same' and mode='valid' joined
    the paths (renamed fftconvolve / fftcorrelate, dropping the stale
    _full suffix), with slice formulas verified against stock across both
    length orders and parities - including numpy's internal correlate
    swap, which flips 'same' centering when the second operand is longer
    with an even min-length (caught by an asymmetric probe; the naive
    identity passes self-correlation, which is palindromic and hides it).
    Per-mode naive-work floors from the extended FFTCONV-CAL battery
    (contended 56-86%, so understated): same >= 3e6 (2.9-4.9x measured,
    (1000,1000) straddled min-win across three runs and stays out), valid
    >= (max-min+1)*min >= 2e6 (1.6-3.3x; the near-equal-length valid call
    is nearly free on stock, measured 0.01-0.02x for FFT, and the work
    model itself excludes it). Bare np.correlate(a, v) on unequal lengths
    (default valid) now legitimately dispatches: 3.0-3.2x. int64/int32
    both modes 12.7-14.3x, still bit-identical under the 2^52 bound.
  - >-
    SHIPPED (2026-08-23) as fftconvolve_full + fftcorrelate_full
    (src/pyoverdrive/fastpaths/fftconvolve.py): full-mode np.convolve /
    np.correlate on 1-D same-dtype float64/int64/int32 with min(n, m) >=
    1000 and n*m >= 1e6 routes to rfft/irfft with 5-smooth padding
    (FFTCONV-CAL battery: 5-smooth beats power-of-two 4.22x vs 1.76x at
    20000x1000 and rescues shapes pow2 loses). Floats require all-finite
    inputs (naive keeps NaN damage local, FFT smears it) and claim numeric
    equality (~1e-12 scaled); ints ship bit-identical under scipy
    choose_conv_method's exactness bound max|a|*max|v|*min(n,m) <=
    min(2^52-1, dtype max), which also excludes stock integer wrap-around.
    Measured with both floors satisfied: float64 2.3-5.1x, int64 5.9-13.4x,
    int32 6.7-18.0x; thin kernels (m=100-300 under long signals) stay on
    stock, losing or marginal everywhere measured. mode='same'/'valid'
    unmeasured, stay on stock.
  - >
    The single transparent fast-path shape: for np.correlate/np.convolve
    called with mode='full' or 'same' on two same-dtype real (non-object)
    1-D arrays whose combined size exceeds a calibrated threshold N* (to be
    set by the Dyno reproducer, not guessed), route internally to an
    rfft/irfft-based convolution instead of the naive direct-summation loop;
    below N*, or for object-dtype arrays, or for the cheap single-lag
    'valid' case, stay on the existing naive path. This mirrors cournape's
    own proposal in the thread ("force naive, fft or heuristic") rather than
    inventing a new dispatch convention.
  - >
    Semantics differ in three ways once the fast path fires: (1) results
    become approximate rather than exact, on the order of ~1e-11 relative
    error per pv's estimate, instead of numpy's current exact naive-summation
    result; (2) integer inputs must be cast to complex/float internally
    (per pv, numpy currently has no integer-native FFT convolution path),
    so an integer-in/integer-out contract is not preserved; (3) object-dtype
    arrays cannot use the FFT path at all (per cournape) and must always
    fall back to naive.
  - >
    The 171.4x figure is a floor, not a measurement: the original reporter's
    numpy run was killed after exceeding 60s with no logged completion time,
    so the real gap at 1e6 could be substantially larger. The Dyno reproducer
    should not anchor calibration to this number; it exists only to satisfy
    the "never null" claim field until a real numpy-vs-candidate run replaces
    it.
  - >
    Related to OPP-000002 (np.inner ndim>2 via tensordot) only loosely: both
    are cases where NumPy currently uses a straightforward direct-computation
    path and a size-dependent switch to a more sophisticated algorithm
    (tensordot's BLAS reshape; here, FFT) could pay off past some crossover
    N. No existing corpus item concerns convolution, correlation, or FFT
    directly, so this is the first spectral-method opportunity on file.
  - >
    Downstream evidence this pain recurs: bids-standard/pybids#411 ("ENH,
    Improve convolution performance for Sparse variables", closed) shows at
    least one real downstream project had to build its own convolution
    performance fix rather than rely on numpy/scipy, and scipy/scipy#2651
    ("ENH, Fold fftconvolve into convolve/correlate functions as a
    parameter", closed) shows the same ask was made on the scipy side.
    Neither confirms numpy maintainers agreed to do this; both are closed
    without a linked resolution visible in this dump.
