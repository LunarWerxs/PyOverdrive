id: OPP-000033
title: "datetime64 array comparison is up to ~7x slower than an int64 view, but only in a column-broadcast shape"
sources:
  - url: https://github.com/numpy/numpy/issues/7487
    repository: numpy/numpy
    type: issue
    number: 7487
    state_at_ingestion: open
    retrieved_at: "2026-08-24T07:00:00Z"
claim:
  speedup: 6.94
  baseline: >-
    utc_dt > utc_dt[:, 0:1], a greater-than comparison of a 2-D datetime64
    array against itself sliced to a single broadcast column, as timed by
    the issue author (dmbelov) with %timeit in the issue body itself:
    100 ms per loop (10 loops, best of 3). utc_dt is built as
    date_d[:, None] + time_t[None, :], with date_d =
    numpy.arange(numpy.datetime64('1990-01-02'), numpy.datetime64('2005-12-31'))
    and time_t = numpy.arange(1440).view('m8[m]').
  candidate: >-
    utc_dt.view('i8') > utc_dt[:, 0:1].view('i8'), the same comparison
    with both operands reinterpreted as int64 first, same post: 14.4 ms
    per loop (100 loops, best of 3). The 6.94 speedup recorded above is
    DERIVED from the reporter's own pair of numbers (100 / 14.4 =
    6.9444..., rounded to 6.94); the reporter's own prose says the native
    comparison "takes 7 times longer" but the thread never states this
    precise ratio explicitly. A second, weaker DERIVED pair from the same
    post: subtraction, utc_dt - utc_dt[:, 0:1] at 119 ms/loop (10 loops,
    best of 3) vs utc_dt.view('i8') - utc_dt[:, 0:1].view('i8') at
    35.2 ms/loop (10 loops, best of 3): 119 / 35.2 = 3.3806..., rounded to
    3.38.
  hardware: >-
    unknown; the issue gives no CPU, OS, machine spec, or precise
    numpy/Python version anywhere in the dump. The issue title says
    "NumPy 1.9.3", but all timings are %timeit output from IPython
    ("In [17]:" style prompts) with no environment banner printed, and
    shoyer's source-code links (in maintainer_objections/notes) resolve to
    the v1.11.0 tag of numpy/core/src/umath/loops.c.src, a version
    discrepancy the dump does not explain. See the age/version caveat in
    notes below.
affected_operations: [numpy.greater, numpy.subtract]
input_regime:
  dtypes:
    - "datetime64[m] (date_d is built from day-precision datetime64
      literals via numpy.datetime64('1990-01-02') / numpy.datetime64('2005-12-31');
      time_t is timedelta64[m] from numpy.arange(1440).view('m8[m]');
      date_d[:, None] + time_t[None, :] resolves the broadcast-added
      result to minute-precision datetime64)"
    - "int64 (the .view('i8') candidate, same buffer reinterpreted;
      npy_datetime/npy_timedelta are, per shoyer, simply aliases to
      int64/long under the hood)"
  sizes:
    - "1440 (minutes-per-day axis, explicit numpy.arange(1440))"
    - "N (unstated day count from numpy.arange(numpy.datetime64('1990-01-02'),
      numpy.datetime64('2005-12-31')), a roughly 16-year daily date range;
      the thread never states N directly, so it is not recorded as a
      number here)"
  notes: >-
    Only measured concretely for the specific broadcast shapes in the
    issue thread, via %timeit in IPython, with no CPU/OS/numpy-version
    info printed anywhere in the dump. The 6.94x (comparison) and 3.38x
    (subtraction) headline gaps hold for the column-broadcast shape,
    utc_dt > utc_dt[:, 0:1] / utc_dt - utc_dt[:, 0:1] (an (N,1) operand
    broadcast against an (N,1440) array along the last axis). dmbelov's
    follow-up comment measured two more shapes on the same data: same-
    shape contiguous comparison (utc_dt > utc_dt) narrows the gap to
    10.5 / 8.56 = 1.2266 (DERIVED, rounds to 1.23), and row-broadcast
    comparison (utc_dt > utc_dt[0:1, :], a (1,1440) operand) narrows it
    further to 18.2 / 17.8 = 1.0225 (DERIVED, rounds to 1.02), i.e. almost
    no win at all outside the column-broadcast shape. shoyer's own read:
    "It does look like something funny is going on with the higher
    dimensional array. Not quite sure what that is, though -- this isn't
    part of the codebase I'm very familiar with." No maintainer ever
    explained the column-broadcast-specific gap. The arange-generated test
    data also contains no NaT elements anywhere, so the NaT hazard
    described below is a correctness concern raised by shoyer's mechanism
    explanation, not something this thread's own benchmarks exercise or
    verify.
status: not_reproduced
license_review: pending
reproducer: benchmarks/historical/opp_000033_datetime_compare.py
current_numpy_result:
  verified_speedup: null
  fingerprints: [9bbe7063c555]
  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0-1% load): NOT REPRODUCED at the claimed scale, and no
    shippable regime exists. The i8-view mechanism survives but modern
    numpy has closed most of the 2016 gap: unguarded view wins only
    1.34-1.39x on the thread's 5842x1440 M8[m] shapes (vs the claimed
    6.94x; the column-broadcast-specific pattern is gone) and 1.07x on a
    1-D M8[ns] array at 1e6. The NaT guard a correct predicate MUST run
    (NaT compares False natively but INT64_MIN compares normally under
    the view) costs more than the win: isnat().any() lands at 0.34-0.73x,
    and even the cheapest guard (SIMD int64 min-reduce) gives 0.63-0.96x
    on 2-D and 1.22x on 1-D - all below the 1.3x min-win. Subtraction is
    0.90x, i.e. stock is already faster. Parked: modern numpy's datetime
    loops are close enough to the int64 loops that a value-scan guard
    inverts the residual margin. Evidence:
    benchmarks/results/OPP-000033/9bbe7063c555.json.
main_branch_result: null
correctness_risk: high
implementation_risk: high
maintainer_objections:
  - author: shoyer
    date: "2016-03-31"
    quote: >-
      To be clear, npy_timedelta and npy_datetime are simply aliases to
      int64/long. Suggestions for changes and/or pull requests would be
      appreciated! One reason datetime operations can be slower is that
      they need to check for NaT, which is implemented under the hood as
      the smallest int64 value. But I'm not sure that accounts for the
      difference here, given that in NumPy 1.10 and earlier, comparisons
      between datetimes didn't even bother to check for NaT. So it may
      come down to vectorization and/or loop unrolling. NumPy uses some
      tricks for integers that it doesn't bother with for datetimes.
  - author: shoyer
    date: "2016-03-31"
    quote: >-
      It does look like something funny is going on with the higher
      dimensional array. Not quite sure what that is, though -- this isn't
      part of the codebase I'm very familiar with.
  - author: njsmith
    date: "2016-03-31"
    quote: >-
      It's possible @juliantaylor will have some insight... Though I
      suspect that it's just that hand optimized simd beats generic for
      loop like @shoyer says.
