id: OPP-000055
title: "numpy.vectorize wrapping a ufunc runs a Python object loop over a callable that is ALREADY vectorized - calling the ufunc directly is bit-identical and 14-101x faster; served by installing a SUBCLASS of np.vectorize so isinstance and type() keep working"
sources:
  - url: https://numpy.org/doc/stable/reference/generated/numpy.vectorize.html
    repository: numpy/numpy
    type: benchmark
    number: 0
    state_at_ingestion: open
    retrieved_at: "2026-08-25T00:20:00Z"
claim:
  speedup: null
  baseline: >-
    NumPy's own documentation states the vectorize function "is
    provided primarily for convenience, not for performance. The
    implementation is essentially a for loop." The cost is therefore
    documented upstream rather than reported as a bug, and no
    third-party claim is attributed here.
  candidate: >-
    Wrapping one of NumPy's OWN ufuncs in vectorize is pure loss: the
    wrapped callable is already a fully vectorized C loop, and the
    object loop calls it once per element. This happens in real code -
    inside generic helpers, in teaching material, and wherever a
    callable is passed around and vectorized defensively. Calling the
    wrapped ufunc on the whole array instead is the same arithmetic on
    the same values.
  hardware: "measured here; no third-party claim to attribute"
affected_operations: [numpy.vectorize]
input_regime:
  dtypes: [float64]
  sizes: [100, 1000, 10000, 100000, 1000000]
  notes: >-
    An instance constructed as vectorize(f) where f is one of the 34
    served unary ufuncs and no otypes/signature/excluded/cache were
    given, CALLED with exactly one positional argument that is a plain
    float64 ndarray with ndim >= 1 and size > 0. Everything else runs
    stock's own __call__ unchanged: scalars and 0-d input (stock
    returns a 0-d ndarray, the raw ufunc a NumPy scalar - same value,
    different type), empty input (stock RAISES ValueError without
    otypes), float32 and other dtypes (stock infers the output dtype
    from a trial call on the first element and runs an object loop,
    which for float32 computes in float64 and casts - genuinely
    different bits from the native float32 SIMD loop).
status: shipped
license_review: clean
reproducer: benchmarks/historical/opp_000055_vectorize_ufunc.py
current_numpy_result:
  verified_speedup: null
  fingerprints: [8f8198d9abab, 9bbe7063c555]
  detail: >
    Probe 2026-08-24. Dev box (fp 8f8198d9abab, numpy 2.4.5, float64
    n=1M): sqrt 101.1x, exp 36.6x, sin 20.7x; the first survey cell
    measured 17.8x for sin at default settings. Idle box (fp
    9bbe7063c555, numpy 2.5.2, 0-1% load): 14.1x for sin at 1M.
    BATCH11-CAL smoke (dev box): sqrt 94.8x at n=10_000 and 79.0x at
    1M, exp 34.3x/26.1x, sin 25.4x/16.1x - the margin is largest at
    mid sizes, where the per-element Python overhead dominates most
    relative to the vectorized call.
