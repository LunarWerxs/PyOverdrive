notes:
  - >-
    THE SERVED SET IS MEASURED, NOT ASSUMED, and this is the whole
    safety argument. NumPy's scalar loop (what vectorize's object loop
    calls) and its array loop are separate implementations that may
    differ in the last ulp, which would make this path a silent
    value-changer. All 34 candidate unary float64 ufuncs were verified
    bit-identical between the two loops over an adversarial sweep
    (tiny/huge/negative/exact halves/domain edges) on BOTH benchmark
    machines - 34/34 on numpy 2.4.5 Windows AMD Zen 4 and on numpy
    2.5.2 Windows Intel. The differential suite re-verifies EVERY
    member wherever it runs, so a future NumPy build that breaks the
    property fails CI on that platform instead of shipping wrong
    values.
  - >-
    implementation_risk medium is the CLASS PATCH, a first for this
    project. np.vectorize is a class and the slow part is the
    instance's __call__, so a plain function wrapper would make
    isinstance(v, np.vectorize) raise TypeError outright. The gearbox
    grew a ClassPath registration that installs a SUBCLASS of the
    stock class instead: construction, attributes, isinstance,
    type(v) is np.vectorize, and __name__/__qualname__ all keep
    working, and exactly one method is overridden. unpatch() restores
    the original class object. The kill switch is LIVE - the installed
    subclass consults the path's enabled flag on every call - because
    unlike a FastPath it cannot simply leave an active list.
  - >-
    selfcheck was extended to cover class paths (construct through the
    patched class and through stock, call both, compare), so this path
    is verified on the user's own machine like every other.
  - >-
    The direct call uses the STOCK ufunc, not the live attribute:
    stock vectorize calls the wrapped callable once per ELEMENT, where
    every PyOverdrive ufunc path declines on scalar input, so stock's
    own answer IS the stock ufunc's. Like OPP-000054, the lookup is
    rebuilt on the gearbox generation counter because while enabled
    the caller's np.sin is PyOverdrive's wrapper.
  - >-
    license_review clean: calls the user's own wrapped ufunc; no
    third-party code.
  - >-
    SHIPPED (2026-08-25, batch 11) as vectorize_ufunc_direct.
