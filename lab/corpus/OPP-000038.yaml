id: OPP-000038
title: "histogramdd (and histogram2d) uses per-dimension searchsorted on an edges array even when bins are uniform by construction; reporter claims 4-5x via direct index-calc"
sources:
  - url: https://github.com/numpy/numpy/issues/17676
    repository: numpy/numpy
    type: issue
    number: 17676
    state_at_ingestion: open
    retrieved_at: "2026-08-24T12:00:00Z"
claim:
  speedup: null
  baseline: >-
    numpy.histogram2d(xy[:, 0], xy[:, 1], bins=[100, 100], range=[[-3, 3],
    [-3, 3]]) on xy = np.random.normal(0, 1, (int(5e6), 2)) with seed 42,
    per the reproducing code block in the issue body (bins uniform by
    construction: int bin counts plus an explicit range). This path goes
    through histogramdd, which builds an explicit edges array per
    dimension and locates samples via searchsorted. No printed timing
    value is present in the dump; the code block times with time.time()
    but no captured output.
  candidate: >-
    The reporter's own local implementation, linked as a numpy fork commit:
    https://github.com/aminnj/numpy/commit/6601776e7e1d84047f203e62ca5f3d2e43ca1da4,
    described in the issue as "passes unit testing." Recorded here as
    provenance only: PyOverdrive must reimplement the direct-bin-index
    technique from first principles rather than vendor or adapt this
    commit. numpy's own code is BSD-licensed, but house license-review
    policy prefers no vendoring of external implementations regardless of
    license compatibility. The underlying technique (direct bin-index
    computation for uniform bins, i.e. no edges array or searchsorted at
    all) is generic and independently implementable.
  hardware: >-
    unknown; the issue gives no explicit CPU/OS line. The only environment
    info is "NumPy/Python version information: 1.19.0, 3.7.3 (default, Mar
    27 2019, 09:23:39) [Clang 10.0.0 (clang-1000.11.45.5)]", which implies
    a Clang toolchain (likely macOS) but states no OS or CPU model.
affected_operations: [numpy.histogram2d, numpy.histogramdd]
input_regime:
  dtypes: [float64]
  sizes: [5000000]
  notes: >-
    Measured concretely (per the reporter's own unpublished local timings
    and the reproducing code block) only for: 5e6 samples, 2 dimensions
    (via histogram2d -> histogramdd), 100 bins per dimension, uniform range
    [-3, 3] in both dimensions, drawn from a standard 2D gaussian
    (np.random.normal(0, 1, (5_000_000, 2)), seed 42). Bins given as
    bins=[100, 100] with range=[[-3, 3], [-3, 3]] (int bin counts plus an
    explicit range, i.e. uniform-by-construction), compared against the
    identical histogram2d call with bins given as an explicit edges array
    (edges = np.linspace(-3, 3, 100 + 1), bins=[edges, edges]). No 1-D-only,
    non-uniform-bin, weights=, or density=True case is exercised anywhere
    in the thread.
