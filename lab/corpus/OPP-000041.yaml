notes:
  - >-
    Class evidence only, not a literal claim about this record's ops:
    numpy/numpy#5691 is about numpy.nanmax/numpy.nanmin (~3x slower
    than amax/amin as reported in 2015), fixed by 2026 per jorenham's
    2026-07-22 closing comment, both at 105 us. This record does NOT
    claim nanmax/nanmin are slow today; they are explicitly excluded
    from affected_operations. The issue is cited because it documents,
    with a maintainer diagnosis, the same mechanism class - a per-call
    nan check/mask imposing overhead beyond the plain reduction - that
    this record's own measurements show still applies to nanmean,
    nansum, nanstd, and nanvar.
  - >-
    juliantaylor (CONTRIBUTOR), 2015-03-18, on why nanmax was slow:
    "note that on each new min/max it needs to check for a nan, that
    why its so much more expensive. Though it seems the compiler
    anaconda uses has a poor isnan implementation. On linux with gcc
    the difference is only about 50%" - the maintainer's own diagnosis
    already pointed at isnan cost and platform/compiler variance as the
    driver, the same lever this record's candidate manages directly
    with one explicit isnan scan rather than the stock implementation's
    mask-and-copy.
  - >-
    Second source, pydata/bottleneck README benchmark table
    (https://github.com/pydata/bottleneck, run on numpy 2.4.2): shape
    (100,), axis=0, bottleneck's C implementations vs stock numpy:
    nansum 12.2x, nanmean 29.8x, nanstd 34.2x. This documents the same
    overhead class from a different angle (a C reimplementation beating
    the Python-level nanX wrapper) and is independent of numpy/numpy#5691.
  - >-
    correctness_risk is medium: all-NaN-slice warnings (stock nanmean
    etc. emit RuntimeWarning and return NaN for an all-NaN slice/axis),
    empty-input warnings, and the dtype/out/keepdims/where kwargs must
    be refused by the fast path (fall back to stock) rather than
    silently mishandled - the isnan-scan-then-plain-reduction route was
    only verified bit-identical to stock in the plain no-kwarg case.
  - >-
    license_review clean: isnan scan (numpy.isnan / numpy.any) followed
    by the plain stock reduction (mean/sum/std/var) is a standard,
    well-known technique, not third-party code; no bottleneck source
    was inspected or adapted, its README table was used only as a
    cited comparison number.
  - >-
    SHIPPED (2026-08-24) as nanreduce_scan (src/pyoverdrive/fastpaths/nanreduce_scan.py): four paths nanmean_scan/nansum_scan/nanstd_scan/nanvar_scan, float64, per-op floors 100/10000/3000/3000 from BATCH6-CAL, one isnan probe then the plain reduction, NaN-present input falls back to stock inside the run. Bit-identical. 60 differential tests plus a property suite.
