id: OPP-000041
title: "numpy.nanmean/nansum/nanstd/nanvar retain Python-level mask-and-copy overhead in the no-NaN case; isnan-scan-then-plain-reduction wins there; nanmax/nanmin already fixed upstream and excluded"
sources:
  - url: https://github.com/numpy/numpy/issues/5691
    repository: numpy/numpy
    type: issue
    number: 5691
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T08:10:16Z"
  - url: https://github.com/pydata/bottleneck
    repository: pydata/bottleneck
    type: benchmark
    retrieved_at: "2026-08-24T12:00:00Z"
claim:
  speedup: 29.8
  baseline: >-
    PRIMARY, CURRENT source (pydata/bottleneck README benchmark table,
    https://github.com/pydata/bottleneck, run on numpy 2.4.2, shape
    (100,), axis=0): stock numpy's Python-level nanmean, nansum, nanstd
    against bottleneck's C implementations. Reported ratios: nansum
    12.2x, nanmean 29.8x, nanstd 34.2x. The speedup field above uses the
    nanmean figure since nanmean is this record's headline affected op;
    nansum and nanstd are the same table, same run, kept verbatim. No
    nanvar figure appears in the cited bottleneck table.
  candidate: >-
    bottleneck's C-level nan-aware reduction kernels (not adopted by
    PyOverdrive; cited only as documentation that the SAME overhead
    class exists today. This record's own candidate is a different
    mechanism: an isnan scan followed by the plain stock reduction -
    mean/sum/std/var - run when the scan finds no NaN.)
  hardware: >-
    unknown for the bottleneck README table (no CPU/OS stated, only
    numpy 2.4.2). SEPARATE, OLDER (2015) claim, kept apart as CLASS
    EVIDENCE and NOT folded into the ratio above: original reporter
    gdementen, issue body, 2015-03-18T15:38:45Z, numpy 1.9.2 from conda,
    Windows 7 64b: "there is almost a 3x difference between nanmin and
    nanmax while there is barely any difference between np.amin &
    np.amax." Timings from the issue body, a = np.arange(1e6):
    np.nanmin(a) 850 us, np.nanmax(a) 2.56 ms, np.amin(a) 515 us,
    np.amax(a) 515 us. juliantaylor (CONTRIBUTOR), 2015-03-18, diagnosed
    the mechanism: "note that on each new min/max it needs to check for
    a nan, that why its so much more expensive." This 2015 issue is
    CLOSED (state_reason completed) as of 2026-07-22, when jorenham
    (MEMBER) posted: "This no longer seems to be an issue" with
    np.nanmin(a) and np.nanmax(a) both at 105 us on current numpy - i.e.
    nanmax/nanmin are HONESTY-POINT EXCLUDED from this record's regime;
    they were fixed upstream and are not in affected_operations. The
    2015 issue is retained only as class evidence that numpy's nan-
    wrapper functions have historically carried Python-level overhead
    beyond the underlying plain reduction, the same overhead class this
    record's own measurements show still applies today to nanmean,
    nansum, nanstd, and nanvar specifically.
affected_operations: [numpy.nanmean, numpy.nansum, numpy.nanstd, numpy.nanvar]
input_regime:
  dtypes: [float64]
  sizes: [300, 1000, 10000, 100000]
  notes: >-
    No-NaN data is the winning regime: the candidate is an O(n) isnan
    scan followed by the plain reduction, which beats the stock nanX
    wrapper's mask-and-copy path even after paying for the scan,
    because the common defensive-usage case is data that turns out to
    contain no NaN at all. Measured 1-D at n=300, 1000, 10000, 100000
    and 2-D at (1000,100) and (100,1000) with axis=1. NaN-present data
    falls back at ~0.96x scan cost: when NaN IS present the scan is
    wasted before the candidate falls back to the stock implementation,
    measured at 0.96x (1-D n=100000, 1% NaN) - breakeven-to-slightly-
    behind, not a win. nanmax/nanmin excluded (already fast upstream):
    numpy.nanmax and numpy.nanmin are explicitly OUT of this record's
    regime. The 2015 class evidence (numpy/numpy#5691) that motivated
    looking at the nanX family no longer applies to them - modern numpy
    already fixed that overhead, measured separately at 0.61-1.08x for
    nanmin (no win), so nanmax/nanmin are not part of this record's
    affected_operations.
status: performance_validated
