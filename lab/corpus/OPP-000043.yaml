id: OPP-000043
title: "np.nanmedian(axis=...) on 2-D data loops per-slice in Python; isnan-scan-then-median vectorizes it for many short slices, vanishes for few long slices; source issue (numpy/numpy#4683) is actually about np.ma.median, same mechanism class but not literally nanmedian"
sources:
  - url: https://github.com/numpy/numpy/issues/4683
    repository: numpy/numpy
    type: issue
    number: 4683
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T08:10:22Z"
claim:
  speedup: null
  baseline: >-
    ISSUE BODY (juliantaylor, 2014-05-07T18:11:04Z, issue title "poor
    performance of multidimensional masked median"): on
    d = np.random.uniform(size=(200, 200, 50)), timeit best-of-3 results
    were np.median(d, axis=2) = 40.1 ms per loop; np.nanmedian(d, axis=2)
    = 1.32 s per loop; np.ma.median(d, axis=2) = 4.89 s per loop. These
    are the issue's own stated numbers, verbatim, not a candidate-vs-
    baseline speedup pair - they show stock np.nanmedian already running
    roughly 33x slower than stock np.median on this shape (1.32 / 0.0401),
    a ratio derived here only by dividing the two stated times, not
    independently reported by the issue.
  candidate: >-
    HONESTY POINT: numpy/numpy#4683 is fundamentally about np.ma.median
    (masked arrays) being slow multidimensionally due to apply_over_axis,
    not literally np.nanmedian. It is the same mechanism class (a
    per-slice Python loop wrapped around median) but not the same
    function. The issue proposes no nanmedian-specific candidate fix: its
    own suggested workaround is "using bottlenecks nanmedian which is on
    par with our non-masked performance (and better for the slow axis)",
    stated only in the context of the masked comparison, with no isolated
    nanmedian-vs-bottleneck number given anywhere in the dump. The fix
    that actually closed this issue, PR numpy/numpy#4760 ("ENH: rewrite
    ma.median to improve poor performance for multiple dimensions",
    juliantaylor, merged 2014-06-02T22:32:02Z, "Work around this issue by
    using indexing to select the median element instead of
    apply_along_axis. ... Closes gh-4683."), targeted np.ma.median via
    fancy indexing, not np.nanmedian. This record's own surface (an
    isnan-scan-then-median fast path) targets np.nanmedian directly; its
    slice-loop slowness and the fast path's win were measured directly on
    Dyno (see current_numpy_result below), not sourced from this issue.
  hardware: unknown (2014 issue report; no CPU/OS stated in the dump)
affected_operations: [numpy.nanmedian]
input_regime:
  dtypes: [float64]
  sizes: [1000000, 2000000]
  notes: >-
    Targets np.nanmedian(arr, axis=...) on plain 2-D float64 data (dtype
    not independently confirmed in the Dyno evidence citation beyond the
    standard numpy default; treated as float64). The candidate technique
    is a single O(n) isnan scan over the whole array followed by plain
    np.median(axis=...) (vectorized internally via partition) when the
    scan finds zero NaNs - bit-identical to stock np.nanmedian in that
    case. ADMISSION RULE (many short-to-moderate slices): the win holds
    when the axis being reduced produces numerous short-to-moderate
    slices, e.g. (1000,1000) axis=1 -> 1000 slices of length 1000,
    measured 1.93x. ANTI-REGIME (few long slices): the win VANISHES when
    there are few, long slices, e.g. (200,10000) axis=1 -> only 200 slices
    of length 10000, measured 0.97x, because stock's small per-slice
    Python loop count is amortized across few iterations and no longer
    dominates. NaN-present input falls back to stock's own path after
    paying the scan cost, measured at ~1% overhead (0.99x) on
    (1000,1000) axis=1 with 1% NaN.
