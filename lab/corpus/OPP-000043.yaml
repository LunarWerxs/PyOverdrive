notes:
  - >-
    Mechanism: stock np.nanmedian on an axis reduces each 1-D slice with a
    Python-level loop (conceptually the same class of apply_along_axis-
    style looping that this issue documents for np.ma.median), which is
    cheap per call but adds up across many slices. The candidate fast
    path instead runs one O(n) isnan scan over the whole input; if no NaN
    is present, it defers to plain np.median(axis=...), whose C
    implementation is vectorized across slices via partition and does not
    pay a per-slice Python cost. If any NaN is present, the scan cost
    (~1% overhead, measured) is paid and stock's own NaN-aware path
    handles correctness, so results are never wrong in the NaN case, only
    slightly slower to detect it.
  - >-
    Correctness risk (medium): stock np.nanmedian emits a RuntimeWarning
    ("All-NaN slice encountered") when an entire reduced slice is all-NaN;
    the fast path must reproduce this warning behavior exactly on the
    fallback route, not just the returned values, or existing user code
    that filters warnings will silently regress. keepdims, out, and
    overwrite_input are all stock np.nanmedian kwargs; the fast path is
    only validated for the plain no-kwarg call shape and must explicitly
    refuse (not silently mishandle) any call using keepdims, out, or
    overwrite_input until each is separately verified against stock.
  - >-
    Corroborating context from the cross-referenced thread (astropy/
    ccdproc#74, "masked median_combine is excruciatingly slow", mwcraig,
    2014-05-12T16:35:02Z, explicitly cited by that issue as "a known issue
    ... in numpy: numpy/numpy#4683"): its own benchmark table reports
    np.median (unmasked) at 1.07s (1x, reference) versus np.ma.median at
    838s (783x slower), a plain Python loop-over-pixels workaround at
    254s (237x), scipy.stats.nanmedian at 232s (216x), and
    bottleneck.nanmedian at 1.35s (1.26x). This table is kept here only
    as color establishing how severe Python-loop-per-slice slowdowns get
    in this mechanism class; scipy.stats.nanmedian and bottleneck.nanmedian
    are third-party functions, not np.nanmedian, and none of these
    numbers are used anywhere in this record's claim or evidence.
  - >-
    Thread engagement, with authors and dates: opened by juliantaylor
    (CONTRIBUTOR) 2014-05-07T18:11:04Z, listing five possible
    improvements to ma.median and asking "any more options I'm might be
    overlooking?" (no reply recorded in this dump). juliantaylor opened
    PR #4760 2014-05-30T17:08:07Z citing this issue as the motivation
    ("many masked median along a small dimension is extremely slow due to
    the usage of apply_along_axis which iterates fully in python"),
    referenced three WIP commits on a personal fork 2014-05-30 through
    2014-06-02, and the PR was merged same day by charris (2014-06-02T
    22:32:02Z), which also closed this issue. A later, unrelated issue
    (numpy/numpy#4814, durack1, "Memory bloat using numpy.ma.median",
    2014-06-19T02:18:29Z) was cross-referenced into this thread's timeline
    but reports a memory-growth problem on numpy 1.7.1, not a speed claim,
    and is not used as evidence here. Zero direct comments were posted on
    issue #4683 itself (comments: 0); all engagement shown above came via
    the linked PR and cross-referenced issues.
  - >-
    license_review clean: the candidate technique (a preliminary isnan
    scan gating a call into plain vectorized np.median) is a standard,
    widely-used technique with no third-party code adapted from this
    thread or any other source.
  - >-
    SHIPPED (2026-08-24) as nanmedian_scan (src/pyoverdrive/fastpaths/nanmedian_scan.py): 2-D C-order float64, axis 1/-1, size >= 200000, reduced length <= 2000 (the measured envelope; the few-long-slices anti-regime and layout flips refused). Bit-identical. 17 differential tests plus a property suite.
