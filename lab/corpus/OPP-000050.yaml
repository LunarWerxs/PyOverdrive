notes:
  - >-
    Comparison mode: numeric - the direct lerp (lo + frac*(hi-lo))
    rounds differently from stock's compiled slope arithmetic. Where
    the arithmetic bin disagrees with bisection (possible only at a bin
    boundary, by the 1e-9 uniformity bound), the lerp is continuous
    across the boundary, so the two answers differ by rounding only.
  - >-
    The uniformity guard doubles as the sortedness guard: stock interp
    does not validate that xp is increasing (garbage in, garbage out);
    this path never has to reproduce that garbage because any
    non-increasing xp fails the uniformity scan and refuses to stock.
  - >-
    license_review clean: direct-index linear interpolation from first
    principles; the thread contains no implementation to borrow.
  - >-
    SHIPPED (2026-08-24, batch 8) as interp_uniform_grid
    (src/pyoverdrive/fastpaths/interp_uniform_grid.py): NQ_MIN=3000,
    UNIFORM_RTOL=1e-9. 23 differential tests plus a property net over
    linspace/arange/nonuniform grids and inside/straddling/on-point/NaN
    query mixes.
