id: OPP-000034
title: "np.argmax along a non-contiguous reduction axis forces a hidden copy; Fortran-order reindexing measured ~19.65x faster on a 10000x10000 array"
sources:
  - url: https://github.com/numpy/numpy/issues/9182
    repository: numpy/numpy
    type: issue
    number: 9182
    state_at_ingestion: open
    retrieved_at: "2026-08-24T07:00:00Z"
claim:
  speedup: 19.65
  baseline: >-
    np.argmax(frames, axis=0) on the C-contiguous 10000x10000 float64 array
    frames = num.random.random((nx, ny)) with nx = ny = 10000 (the setup
    code from the issue body), as timed by commenter "ghost" with %timeit:
    "1 loop, best of 3: 1.9 s per loop" (comment posted 2018-02-16). The
    19.65 speedup recorded above is DERIVED from ghost's own pair of numbers
    (1900 ms / 96.7 ms = 19.65); the thread never states a ratio explicitly.
  candidate: >-
    np.argmax(f, axis=0) where f = num.asfortranarray(frames), i.e.
    converting the same array to Fortran (column-major) order before
    calling argmax along axis 0, posted in the same comment: "10 loops,
    best of 3: 96.7 ms per loop". A pure-numpy layout trick (stock
    np.asfortranarray plus stock np.argmax), no third-party code involved.
  hardware: >-
    unknown; the comment gives no CPU, OS, or numpy/Python version specific
    to ghost's own timing. The original issue reporter's environment was
    "python 2.7.9, numpy 1.14.0.dev0+c556b42" (stated in the issue body for
    the ORIGINAL my_argmax vs argmax(axis=0) timing, itself unquantified as
    a ratio: 21.6250059605s vs 22.8837270737s total for 10 timeit
    iterations each, i.e. ~2.16s vs ~2.29s per loop), but that is not
    confirmed to be ghost's environment for the later F-order comment the
    claim above is based on.
affected_operations: [numpy.argmax]
input_regime:
  dtypes: [float64]
  sizes: ["10000x10000 (1e8 elements, frames/ghost F-order benchmark)", "5500x400 (2.2e6 elements, cipri-tom cython benchmark)"]
  notes: >-
    Measured concretely only for 2-D float64 arrays reduced along axis=0
    (the non-contiguous axis under default C order). The reporter's own
    setup is frames = num.random.random((10000, 10000)); ghost's F-order
    comparison reuses that same variable name and shape. cipri-tom's
    separate cython benchmark uses a smaller (5500, 400) float array, also
    reduced along axis=0: a.argmax(axis=0) "10 loops, best of 3: 22.3 ms
    per loop" vs a Cython reimplementation cy_argmax(a) "100 loops, best of
    3: 3.31 ms per loop" (22.3 / 3.31 = 6.74x, DERIVED, not stated as a
    ratio in the thread; this is a reimplementation route, not the
    layout-reorder route the claim above is built on). No int dtypes, no
    NaN-containing inputs, no 1-D or 3-D+ arrays, and no axis=1 (the
    already-fast axis) timings appear anywhere in the dump.
