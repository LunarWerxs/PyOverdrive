current_numpy_result:
  verified_speedup: null
  fingerprints: [9bbe7063c555]
  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0-1% load): REPRODUCED - the thread's F-order reference
    ceiling measured 20.4x (claim: 19.65x DERIVED) at 10000x10000
    float64, 33.7x float32, 22.3x int64. The naive transparent route
    (ascontiguousarray(a.T) then fast-axis argmax) is a WASH (1.00-1.08x
    everywhere: the explicit transpose copy costs what stock's internal
    copy costs), but a cache-blocked tile transpose plus fast-axis argmax
    wins at scale: 2.52x at 10000x10000 f64, 4.05x f32, 2.52x int64,
    1.92x at 100000x100 - while losing at 1000x1000 (0.63x) and
    100x100000 (0.96x), so the predicate needs a rows floor (probed by
    BATCH4-CAL). axis=1 anti-regime confirmed at parity; NaN-salted
    correctness exact. Evidence:
    benchmarks/results/OPP-000034/9bbe7063c555.json.
