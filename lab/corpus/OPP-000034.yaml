maintainer_objections:
  - author: juliantaylor
    date: "2017-05-28"
    quote: >-
      argmax, as it is currently implemented, does not support strided data
      so it must make a copy to create a contiguous block of memory, thus
      the high memory usage and slowness. Running along the fast axis (1,
      as numpy arrays are C ordered) is significantly faster and should not
      need a copy.
  - author: charris
    date: "2017-05-28"
    quote: "Sounds like `argmax` can be improved, so reopening this."
  - author: eric-wieser
    date: "2018-02-08"
    quote: >-
      It's more complex because it handles the following where I think
      your code does not: nan, Complex types.
