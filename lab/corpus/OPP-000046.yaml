notes:
  - >-
    Mechanism, PyOverdrive's own analysis, not stated this way in the
    thread: stock np.nan_to_num on float64 with default kwargs builds its
    result through a chain of np.where allocations. The fast path instead
    copies the input once, then applies in-place np.copyto boolean-mask
    assignment: NaN to 0.0, +inf to float64 max, -inf to float64 min,
    exactly stock's own defaults. The isinf branch (the +inf/-inf masking
    step) is skipped entirely when an .any() probe finds no infinities in
    the array; that probe is counted in the measured cost above, which is
    why the clean regime (2.02x) and the inf-mix regime (1.20x) differ so
    much.
  - >-
    The thread never converges on this mechanism itself. pedersor's own
    for-loop theory was refuted by rkern same day; pedersor's revised
    memory-overhead theory was never confirmed or refuted by a maintainer,
    and the issue was closed on the copy=False workaround rather than on
    any diagnosis of the internal allocation pattern.
  - >-
    Thread engagement: opened by pedersor 2023-02-01T19:45:42Z (NONE
    author association), 4 total comments same day (rkern MEMBER, pedersor
    x2, mattip MEMBER), closed by pedersor 2023-02-01T20:59:13Z,
    state_reason completed, no labels, no linked PRs or commits anywhere
    in the dump, no maintainer proposal to change nan_to_num's internal
    implementation.
  - >-
    license_review clean: the fast path is copy() plus np.copyto
    boolean-mask assignment, a trivial standard technique. Unlike
    OPP-000040's void-view candidates, this thread contributes no
    candidate code at all (only the copy=False kwarg suggestion), so there
    is no third-party snippet provenance to check.
  - >-
    correctness_risk low: the fast path implements exactly three
    documented default replacements (nan=0.0, posinf=float64 max,
    neginf=float64 min) with no value ambiguity. The risk is bounded by
    dispatch discipline, not semantics: non-default nan=/posinf=/neginf=
    kwargs, copy=False, non-float64 dtypes, and complex input must all
    fall back to stock until each is independently measured.
  - >-
    SHIPPED (2026-08-24) as nan_to_num_where (src/pyoverdrive/fastpaths/nan_to_num_where.py): default-args float64 calls only, size >= 10000; copy + in-place copyto masks, isinf pass skipped when no infinity exists. Bit-identical, always a fresh copy. 15 differential tests plus a property suite.
  - >-
    EXTENDED (2026-08-24, batch 7): the scalar-override kwargs regimes
    (nan=/posinf=/neginf= with Python int/float/bool or np.float64 values;
    posinf/neginf may be None) now dispatch too, same SIZE_FLOOR, still
    bit-identical - all three replacement masks are computed from the
    ORIGINAL values exactly as stock does, so a non-finite nan= override
    cannot leak into the inf replacements. Array-like fills, np.float32
    fills, and any copy= stay on stock, unmeasured. BATCH7-CAL (fp
    9bbe7063c555, idle box): nan-override 2.19-2.59x at 1e4-1e6, clean
    with overrides 2.33-3.27x, NaN+inf mix 1.09-1.44x - the same
    every-cell-wins shape as the default-args regime. 26 further
    differential tests plus a property net over the override draws.
