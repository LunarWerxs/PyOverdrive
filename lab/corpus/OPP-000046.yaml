id: OPP-000046
title: "np.nan_to_num(float64, default args) via copy + in-place np.copyto masking: 1.2x-2.2x depending on NaN/inf mix; original 2023 thread reports no benchmark numbers, only memory-overhead symptoms"
sources:
  - url: https://github.com/numpy/numpy/issues/23140
    repository: numpy/numpy
    type: issue
    number: 23140
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T08:10:20Z"
claim:
  speedup: null
  baseline: >-
    pedersor (issue body, 2023-02-01T19:45:42Z): "numpy.nan_to_num is very
    slow for large arrays (e.g. with size 1M+) whereas similar functions
    like numpy.where are not," suspecting "a rather simple python for loop"
    in the implementation, linking
    numpy/lib/type_check.py lines 404-521. rkern (MEMBER,
    2023-02-01T19:48:59Z) refuted the loop-overhead theory: "The for loop
    is not looping over individual values. dest is a 2-item tuple in the
    case of a complex dtype and a 1-item tuple otherwise. The iteration
    overhead should be minimal for large arrays." pedersor then revised the
    diagnosis (2023-02-01T20:17:20Z): "I think that the issue is that
    nan_to_num uses more memory... for sufficiently larger arrays,
    nan_to_num seems to saturate my memory, resulting in vast slowdowns,
    whereas where did not." No numeric timing, array size beyond "1M+", or
    hardware/RAM figure is given anywhere in the dump.
  candidate: >-
    mattip (MEMBER, 2023-02-01T20:35:54Z): "If you want, you can use
    copy=False" (linking the nan_to_num docs). pedersor confirmed
    2023-02-01T20:59:13Z: "Works, thanks!" and closed the issue the same
    minute (state_reason completed). This copy=False kwarg is the thread's
    own resolution; it is a usage workaround, not a numeric benchmark, and
    not the copy+copyto masking technique this record measures.
  hardware: >-
    unknown - the dump carries no CPU/OS/RAM or numpy version from either
    participant; pedersor's "saturate my memory" claim gives no concrete
    memory figure.
affected_operations: [numpy.nan_to_num]
input_regime:
  dtypes: [float64]
  sizes: [10000, 1000000]
  notes: >-
    Targets np.nan_to_num(arr) on a float64 array with the library's own
    stock default kwargs (nan=0.0, posinf=float64 max, neginf=float64 min).
    Measured at n=10,000 and n=1,000,000 across three NaN/inf regimes: 1%
    NaN only, 1% NaN plus ~1% inf mix, and clean (no NaN/inf). Non-default
    nan=/posinf=/neginf= kwargs, copy=False, non-float64 dtypes, and
    complex input are all out of scope and must refuse to dispatch to the
    fast path until separately measured.
