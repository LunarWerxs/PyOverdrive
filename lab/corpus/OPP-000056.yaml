notes:
  - >-
    THREE PATHS, THREE ACCURACY STANDARDS, THREE DIFFERENT GUARDS - the
    reason this is one module and not one path. norm(ord=2) needs only
    sigma_max, which the gram route delivers to eps at ANY condition
    number (measured relerr <= 7.8e-16 from cond 1e2 to 1e14), so it
    carries NO conditioning guard because none is needed. Singular
    VALUES are judged the way LAPACK itself guarantees them - absolute
    error against ||A||, the same standard the shipped eigvalsh paths
    use. pinv is judged relative to its own magnitude.
  - >-
    THE BANDS ARE MEASURED, AND THEY DIFFER BY DIMENSION. Forming the
    gram squares the condition number, so singular-value error grows
    like eps*cond^2 rather than eps*cond. Worst-of-4000 measurements
    (abs error / ||A||): d=2 gives 5.3e-13 at cond 1e4, 7.2e-11 at 1e6,
    5.1e-10 at 1e7; d=3 gives 2.9e-11 at 1e3, 2.7e-9 at 1e4, 3.0e-7 at
    1e5 - a worse constant because the trigonometric solution amplifies
    error as the gram's eigenvalues cluster (the mechanism documented in
    eigvalsh_3x3's DEGENERACY_MIN). Each floor is the last decade
    clearing the 1e-9 contract with a decade of margin:
    SVDVALS_SIGMA_RATIO_MIN = {2: 1e-6, 3: 1e-3}. pinv's error is only
    LINEAR in cond (2.2e-14 at 1e2, 2.4e-10 at 1e6, 2.2e-9 at 1e7), so
    one floor of 1e-6 serves both dimensions.
  - >-
    A SECOND, INDEPENDENT HAZARD that the conditioning band does not
    catch, and that the first build of this module shipped wrong: a
    COALESCING PAIR of singular values. It is unrelated to
    conditioning - measured on stacks whose sigma_min/sigma_max is a
    healthy 0.3, so every band check passed - and it broke the contract
    by four to thirteen times: d=3 singular values (1, 1, 0.3) gave
    4.3e-9 for svdvals and 4.5e-9 for norm2, (1, 0.3, 0.3) gave 1.3e-8,
    and d=2 (1, 1) gave 7.5e-9. Two different mechanisms: for d=3 the
    arccos amplification eigvalsh_3x3's DEGENERACY_MIN documents, for
    d=2 catastrophic cancellation in the discriminant t^2 - 4*det, whose
    square root then carries ~sqrt(eps) error. One constant guards both
    (the squared relative separation margin >= 1e-12), delivering 3.3e-11
    at the d=2 threshold and ~1e-10 at the d=3 one. An exact multiple of
    the identity is exact and is NOT refused, and a random stack diverts
    only ~0.4% of its matrices, so the margin is untouched.
  - >-
    HOW IT WAS CAUGHT, because the lesson generalizes: not by the
    conditioning sweep, which is what the module was designed around,
    but by an adversarial test agent building fixtures and noticing that
    one shape held ~4e-9 error "regardless of true conditioning". The
    guard that exists is not always the guard that is needed; a second,
    orthogonal failure axis had to be looked for on purpose. norm2 was
    the sharpest case - it had been reasoned about as needing NO guard
    at all, since sigma_max is eps-accurate at every condition number,
    and that reasoning was simply blind to degeneracy.
  - >-
    np.linalg.cond is deliberately NOT served: it divides by sigma_min
    and would amplify exactly the digits the gram route loses.
    matrix_rank is not served either - an earlier adversarial panel
    showed its INTEGER contract breaks about half the time whenever the
    true smallest singular value sits within a few orders of the rank
    tolerance, and no conditioning band closes that.
  - >-
    Band-trippers are SPLIT OUT and served by stock, then scattered
    back; only past BAD_FRAC_MAX=0.25 does the whole call go to stock.
    A whole-stack bail was the batch-10 qr trap: random matrices trip
    any conditioning band with some per-matrix probability, so a large
    enough stack almost surely contains one and the entire large-batch
    regime collapses to stock. Measured here: a stack of 100_000 random
    3x3s DOES contain one, and the first build of this module refused
    that whole stack.
  - >-
    WHAT THE GUARDS COST: a stack that is ENTIRELY ill-conditioned or
    degenerate pays for the closed form, discovers it cannot use it, and
    then pays stock too - measured 0.88-0.96x on the BATCH12-CAL
    mostly-ill cells, i.e. about a 10% regression on that input class.
    Irreducible: conditioning cannot be judged without measuring it. It
    buys 8-24x on ordinary input at a ~0.4% divert rate, so the trade is
    clearly right, but the battery keeps those cells so the cost stays
    visible rather than implied.
  - >-
    The gram is built ENTRYWISE (six products for d=3), never with a
    batched matmul. That single choice moved the measured pinv margin
    from ~4x to ~25x, because the matmul was more expensive than the
    entire closed form it was feeding.
  - >-
    license_review clean: textbook closed forms (quadratic, Smith-form
    trigonometric cubic, adjugate); no third-party code.
  - >-
    SHIPPED (2026-08-25, batch 12) as pinv_small_batch,
    norm2_small_batch and svdvals_small_batch.
