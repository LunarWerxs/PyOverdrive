id: OPP-000056
title: "numpy.linalg.svd(compute_uv=False), norm(ord=2) and pinv each route every matrix of a 2x2/3x3 stack through their own LAPACK call - the closed-form eigenvalues of the small gram matrix (and the adjugate for pinv) serve all three from one vectorized pass, 2.3-73x"
sources:
  - url: https://numpy.org/doc/stable/reference/generated/numpy.linalg.svd.html
    repository: numpy/numpy
    type: benchmark
    number: 0
    state_at_ingestion: open
    retrieved_at: "2026-08-25T02:00:00Z"
claim:
  speedup: null
  baseline: >-
    The same per-matrix-LAPACK-dispatch mechanism this project has
    already shipped four families against (inv OPP-000035, det/slogdet/
    solve OPP-000045, eigvalsh OPP-000030/000048, cholesky OPP-000047,
    qr OPP-000053). numpy's svd/norm(ord=2)/pinv gufuncs call gesdd per
    matrix - pinv twice over, since it decomposes and then reassembles -
    and at d in {2, 3} that setup dominates the arithmetic completely.
    No upstream issue is claimed; the baseline is the implementation.
  candidate: >-
    The singular values of A are the square roots of the eigenvalues of
    the symmetric gram matrix A^T A, which at these sizes has a closed
    form: the quadratic for d=2 and the same trigonometric solution the
    shipped eigvalsh_3x3_trig path uses for d=3. norm(ord=2) needs only
    the largest of them. pinv is not served from the gram at all: for a
    well-conditioned square matrix the pseudo-inverse IS the inverse, so
    the adjugate formula gives it directly, and the gram is used only to
    measure the conditioning cheaply.
  hardware: "measured here; no third-party claim to attribute"
affected_operations: [numpy.linalg.svd, numpy.linalg.norm, numpy.linalg.pinv]
input_regime:
  dtypes: [float64]
  sizes: [100, 300, 1000, 10000, 100000]
  notes: >-
    Plain float64 (..., d, d) ndarrays, d in {2, 3}, ndim >= 3, batch >=
    BATCH_MIN=100, all finite. pinv(a) with NO keyword arguments
    (rcond/rtol/hermitian each change what stock computes);
    svd(a, compute_uv=False) without hermitian (the U/V factors carry a
    sign convention this path does not serve, so the default
    compute_uv=True refuses); norm(a, ord=2, axis=(-2,-1) or the
    positive spelling) without keepdims. Everything else stays on stock.
status: shipped
license_review: clean
reproducer: benchmarks/historical/opp_000056_svd_small_batch.py
current_numpy_result:
  verified_speedup: null
  fingerprints: [9bbe7063c555, 8f8198d9abab]
  detail: >
    Full runs 2026-08-25 on both machines. Idle Intel box (fp
    9bbe7063c555, numpy 2.5.2, 0% load), OPP-000056 reproducer (raw
    closed forms, no guards - the margin claim itself): pinv 2x2 20.6x
    at batch 100 rising to 92.1x at 1000 and 191.0x at 10_000, 34.7x at
    100_000; norm2 2x2 5.6-63.4x; svdvals 2x2 4.1-52.4x; pinv 3x3
    9.8x/38.1x/29.5x/18.2x, norm2 3x3 2.8-12.7x, svdvals 3x3 2.5-11.7x.
    BATCH12-CAL (the SHIPPED route, both bands and both degeneracy
    guards priced in) is the number a user gets: pinv 2x2 18.9-24.0x,
    3x3 8.6-11.3x; norm2 2x2 14.0-15.1x, 3x3 8.0-11.3x; svdvals 2x2
    10.6-12.1x, 3x3 7.8-8.9x. End-to-end through the dispatcher (MVP,
    idle box): pinv 3x3 batch 10_000 17.66x, norm2 2x2 42.10x, svdvals
    2x2 32.52x. Dev box (fp 8f8198d9abab, numpy 2.4.5, contended
    44-65%) agrees in direction at every cell. Out-of-band cells
    measure 0.87-0.99x on both machines, which is the guard cost noted
    below.
