maintainer_objections:
  - >-
    seberg's caveat is about UPSTREAM changing the default ("I would be
    OK if a few people are in favor (with a release note)") - the
    buffered write is a deliberate guarantee, not an accident. It does
    not bind this path, which preserves the guarantee: the gather
    raises before out is assigned, so out is never partially written.
