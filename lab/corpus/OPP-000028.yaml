notes:
  - >-
    Nobody in the thread objects to fixing this; the "objections" recorded
    above are the maintainer diagnosis and the statement that a fix was
    already in flight, which together are the main argument against
    PyOverdrive acting at all. If numpy >= 2.3 restored ordered-input
    performance, the 4.07x claim describes only the 2.0-2.2.x window and
    this record should be re-scoped to users pinned inside it (pandas' own
    pin upgrade is the demand evidence) or closed as fixed upstream.
  - >-
    The opportunity does not automatically die with the upstream fix, it
    shrinks. A sortedness-detecting fast path does an O(n) early-exit scan
    plus np.arange instead of any sort at all, and even the never-regressed
    numpy 1.26.4 spent 444 us argsorting the reporter's already-sorted
    100k-element array. Whether scan-plus-arange beats a fixed stock path
    by enough to clear PyOverdrive's ship bar is exactly what the Dyno run
    must measure; the thread supports no number for that comparison.
  - >-
    Fast-path sketch (detail in docs/research/opportunities/OPP-000028.md).
    Predicate: 1-D contiguous native integer array, default arguments, and
    a strictly-increasing early-exit scan; route: return np.arange(n,
    dtype=np.intp) without sorting. Restricting the predicate to strictly
    increasing input makes the output bit-identical to stock for every
    sort kind, since the argsort permutation is then unique. Hazards that
    set correctness_risk medium: ties (stock quicksort's tie order is
    unspecified but concrete, so arange may differ bitwise unless the scan
    demands strict increase or kind='stable'), float dtypes (a naive
    comparison scan mishandles NaN, whose sort position numpy defines),
    and the guard's cost on non-sorted input, which per the reporter got
    faster in 2.0 and must not be given back (early exit on the first
    inversion keeps the expected cost on random data trivial; the worst
    case is a long sorted prefix with a late inversion, paying the full
    scan and then the full sort).
  - >-
    Attribution trail, all from the dump: charris (2025-04-15) first
    triaged with "Possibly related, #23707, #25610."; r-devulap
    (2025-04-15) confirmed PR 25610's AVX2 argsort as the cause and posted
    the ASV table quantifying it at 4.07x for int64 ordered input.
  - >-
    PR 28619's own body (cross-referenced into the dump) reports the fix's
    after-state on a TGL machine at 500,000 elements: argsort int64
    ('ordered',) went 9.50ms to 3.08ms (ratio 0.32). The same table also
    shows new '+' rows, e.g. time_argsort('quick', 'uint32', ('uniform',))
    at ratio 1.49, i.e. the openmp rework traded some uniform-pattern
    32-bit cases for the ordered-case wins. A PyOverdrive fast path scoped
    to provably-sorted input has no such tradeoff surface, which is worth
    stating when comparing against the upstream fix.
