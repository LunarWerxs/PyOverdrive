id: OPP-000044
title: "numpy.matmul/numpy.dot has no BLAS path for int64/int32 matmul: naive C loop is 2.6x-28.5x slower than float64 BLAS at matched size; cast-to-float64-BLAS-and-round is bit-exact under a provable k*maxA*maxB magnitude bound; thread open since 2019 with no maintainer-endorsed fix"
