notes:
  - >-
    Mechanism, as stated by a numpy maintainer (issue 14556, eric-wieser,
    MEMBER, 2019-09-21T23:16:45Z): "For reference, today we use blas only
    for `single`, `double`, `csingle` and `cdouble`," linking
    numpy/core/src/umath/matmul.c.src#L374-L387 at that commit. This is
    the thread's own confirmation that int64/int32 matmul runs a naive C
    loop with no BLAS dispatch at all, which is the entire premise of
    this record's candidate.
  - >-
    seberg's 2019-09-21 comment (quoted verbatim in maintainer_objections)
    concerns a DIFFERENT, heavier proposal than this record's candidate:
    native integer GEMM via a runtime-switchable cblas backend (per
    lesshaste's 2019-09-20 comment relaying that "MKL have now a integer
    multiplication matrix function"). PyOverdrive's cast-to-float64-BLAS-
    and-round route needs none of that infrastructure - it dispatches to
    the float64 BLAS numpy already ships and calls at every other float64
    matmul, so seberg's stated obstacle does not apply to it.
  - >-
    Fast-path sketch (drafted for this record; not stated in this form by
    the thread). PREDICATE: matmul-shaped call, both operands 2-D, dtype
    int64 or int32 on both sides, non-empty, and
    k * max(abs(A)) * max(abs(B)) < 2^53 (int64) or < 2^31 (int32), where
    k is the shared inner dimension and the two abs-max scans are O(n^2)
    each. ROUTE: cast both operands to float64, dispatch to numpy's
    existing float64 BLAS matmul, cast the float64 result back to the
    original integer dtype. PROOF: within the guard, every accumulated
    partial sum is an integer strictly less than the guard bound, hence
    exactly representable in a float64 mantissa, so the float64 GEMM
    computes the same sums stock's naive int loop would, bit for bit;
    rounding the result back to int is then exact, not approximate.
  - >-
    Reach limitation, same class as OPP-000029's split-complex-matmul
    record: PyOverdrive patches module-level numpy names only. A call
    written as numpy.matmul(a, b) or numpy.dot(a, b) is reachable and
    patchable, but the "@" operator (which invokes ndarray.__matmul__
    directly) and any ndarray method form such as a.dot(b) are NOT
    reachable by a module-level monkeypatch. This matters concretely here
    because the primary issue's own reproducer is written entirely in the
    unreachable operator form ("a @ b"), not as numpy.matmul(...).
  - >-
    Supporting thread (issue 16158, "np.sum enhancement: matmul is faster
    than sum over axis (for integers)", sharpblade4, opened
    2020-05-05T13:18:27Z, closed by seberg 2022-05-24T01:21:41Z).
    Reporter's own reproducer (numpy 1.18.3, uint8, dim=10000):
    np.matmul(mat, vec) "852 ms per loop" (100 loops, best of 3) vs
    np.sum(mat, axis=1) "938 ms per loop" (100 loops, best of 3) - matmul
    beats the naive axis-sum but both are slow relative to BLAS float64,
    consistent with the naive-loop mechanism this record targets. charris
    (MEMBER, 2020-05-05): "This has been noted before. Not sure what the
    best approach would be here." rossbar (CONTRIBUTOR, 2020-07-11): "It
    seems likely that the speedup in this case is due to BLAS/MKL being
    used (you could check with np.show_config). However, this means that
    the performance boost for sum would not be general..." - kept
    verbatim though it is not independently confirmed anywhere in either
    dump that uint8 matmul itself dispatches to BLAS (eric-wieser's
    comment in 14556 says BLAS is used only for
    single/double/csingle/cdouble, which excludes uint8). seberg's closing
    comment (2022-05-24) confirms matmul does not upcast narrow integer
    dtypes before accumulating ("add upcasts to uint64 but matmul does
    not") - direct support for this record's int32 wraparound guard
    rationale in input_regime.notes.
  - >-
    Thread engagement/timeline, issue 14556: opened by lesshaste
    2019-09-20 (1 reaction, +1). lesshaste commented same day relaying a
    third party's note that MKL exposes an integer GEMM. seberg (MEMBER)
    commented 2019-09-21 (quoted in maintainer_objections). eric-wieser
    (MEMBER) commented 2019-09-21 (BLAS-dtype-coverage fact, quoted above
    in notes). No further first-party comments in the dump; labeled "01 -
    Enhancement", "57 - Close?", "component: numpy.ufunc"; state remained
    "open" as of updated_at 2019-09-21T23:16:45Z and at retrieval
    (2026-08-24). Two later cross-references appear in the dump's
    timeline from unrelated downstream repos citing this exact issue as
    the reason for their own workarounds: a matchms PR (tornikeo,
    2024-05-03, merged 2024-06-28) that rewrote similarity functions using
    matmul instead of a jitted loop, reporting in its own PR body "around
    x50 times faster" (matchms's own unverified number, not a numpy
    timing, kept for context only); and a galois issue (theodotk,
    2025-04-07, closed 2025-04-13) titled "Use BLAS for linear algebra
    when available" that names issue 14556 explicitly: "Numpy implements
    matrix multiplication for integer matrices through a slower algorithm
    than for float matrices, where BLAS is used, and there is no plan to
    use it for integer matrices, as per this issue."
  - >-
    license_review is clean: the candidate is a cast-to-float64-BLAS-and-
    round-back technique with a provable exactness bound, a widely known
    approach with no third-party code in either dump to review - the same
    basis OPP-000040's shipped lexsort route and OPP-000029's shipped
    split-GEMM route were marked clean on.
  - >-
    SHIPPED (2026-08-24) as matmul_int_blas + dot_int_blas (src/pyoverdrive/fastpaths/matmul_int_blas.py): 2-D same-dtype int64/int32 pairs, min dim >= 50, exactness bound k*max|A|*max|B| < 2^53 (int64) / 2^31 (int32) checked with Python-int magnitudes (np.abs would wrap INT64_MIN). Provably bit-exact. 27 differential tests plus a property suite. MVP end-to-end: 20.6x at int64 n=400 (dev box, contended).
