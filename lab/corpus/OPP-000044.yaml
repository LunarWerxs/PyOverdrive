    repository: numpy/numpy
    type: issue
    number: 14556
    state_at_ingestion: open
    retrieved_at: "2026-08-24T08:10:18Z"
  - url: https://github.com/numpy/numpy/issues/16158
    repository: numpy/numpy
    type: issue
    number: 16158
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T08:10:25Z"
claim:
  speedup: 65.95
  baseline: >-
    PRIMARY (issue 14556, lesshaste, issue body, 2019-09-20T16:50:13Z, numpy
    1.17.2, Python 3.5.2): a = np.arange(1000*1000,
    dtype=np.int64).reshape((1000,1000)); b = a.copy(); %timeit a @ b ->
    "2.44 s +/- 49.1 ms per loop (mean +/- std. dev. of 7 runs, 1 loop
    each)".
  candidate: >-
    Same comment/issue/date/version: %timeit (a.astype(np.float64) @
    b.astype(np.float64)).astype(np.int64) -> "37 ms +/- 948 us per loop
    (mean +/- std. dev. of 7 runs, 10 loops each)". DERIVED speedup:
    2.44 / 0.037 = 65.946 (~65.9x). This cast-to-float64, matmul, cast-back
    to int64 route is exactly PyOverdrive's candidate mechanism. The
    reporter's own third measurement is kept apart, since it excludes the
    round-trip cast overhead this record's candidate actually pays: afloat
    = a.astype(np.float64); bfloat = b.astype(np.float64); %timeit afloat @
    bfloat -> "21.6 ms +/- 521 us per loop (mean +/- std. dev. of 7 runs,
    10 loops each)" (pure float64 BLAS matmul, no round-trip cast, not
    used in the DERIVED ratio above).
  hardware: >-
    unknown beyond software versions; the issue body states only "1.17.2
    3.5.2 (default, Jul 10 2019, 11:58:48) [GCC 5.4.0 20160609]", no CPU or
    OS named anywhere in the issue or its three comments.
affected_operations: [numpy.matmul, numpy.dot]
input_regime:
  dtypes: [int64, int32]
  sizes: [50, 100, 200, 400, 800]
  notes: >-
    Guard: casting to float64 and rounding back is bit-exact only when
    every float64 partial sum is exactly representable, i.e.
    k * max|A| * max|B| < 2^53 for int64 output (k = shared inner
    dimension). For int32 output, numpy accumulates int32@int32 in int32
    and wraps at 2^31 (see notes: issue 16158, seberg, 2022-05-24, "add
    upcasts to uint64 but matmul does not"), so the guard there is
    k * max|A| * max|B| < 2^31 - a bound that simultaneously proves
    stock's own int32 accumulation could not have wrapped either, so stock
    and candidate results must agree exactly whenever the guard passes.
    Both bounds require two O(n^2) abs-max scans (one per operand) plus
    two float64 casts before dispatch; these are counted as part of the
    measured candidate cost in current_numpy_result, not amortized away.
    Out-of-bound inputs must refuse to dispatch and fall back to stock.
    Measured only as square n x n operands, entries drawn from
    [-1000, 1000), at n = 50/100/200/400/800 (BATCH6-CAL). The original
    issue's reproducer used n=1000 (1,000,000 elements per operand) but
    that exact size was not part of the Dyno sweep and is not claimed
    here. Empty operands and non-2-D (batched/stacked) matmul are out of
    scope until measured.
