maintainer_objections:
  - author: seberg
    date: "2018-12-01"
    quote: >-
      I tend to be wary with such optimizations, they can lead to strange
      bugs in the opposite case where most of the time you have a copy and
      suddenly not. And then you have incorrect in-place behaviour that can
      silently break your code. There are only very few exceptions of this
      rule after all ravel/reshape being the most prominent ones (and
      frankly maybe even the only ones). I personally would like to keep it
      at few exceptions. An interesting option could be an out argument,
      although in the non-trivial overlap case, we would have to be very
      careful.
