notes:
  - >-
    Mechanism, as the thread states it: numpy.roll (and functions that use
    it such as numpy.fft.fftshift, numpy.fft.ifftshift) are inefficient
    when shift=0 (or axis=()) because in that case the output is
    necessarily identical to the input, yet roll still allocates a new
    empty array and copies the old array into it rather than short-
    circuiting. The reporter hit this in a "centered FFT" wrapper around
    numpy.fft.fftn that called fftshift/ifftshift, sometimes with axes=()
    to request an uncentered FFT, and found the uncentered path was not
    actually faster because of this unnecessary copy.
  - >-
    Transparent fast-path sketch: numpy.roll is a patchable module-level
    name (numpy.roll), so a predicate/route wrapper is mechanically
    straightforward. Predicate: shift == 0 (scalar) or shift is an empty
    sequence, OR axis == () (empty axis tuple) -- matching the two
    degenerate cases the issue names. Route: instead of building the
    normal index/take machinery, return a plain COPY of the input array.
    CRITICAL SEMANTICS: np.roll ALWAYS returns a copy, never the input
    array itself, so the fast path MUST also copy -- returning a bare
    alias (literally `return a`) would break caller mutation patterns
    (code that does `out = np.roll(a, 0); out[:] = 0` and expects `a` to
    be untouched) and is exactly the aliasing hazard seberg's comment
    warns about ("incorrect in-place behaviour that can silently break
    your code"). The reporter raises the identical risk independently in
    the issue body: "Obviously, the downside to changing this would be
    potentially breaking existing code that relies on numpy.roll always
    returning a copy (although I don't see any guarantee to that effect in
    the docstring)." A correct fast path saves the shift/index arithmetic
    and the take-based reassembly, not the copy itself.
  - >-
    numpy.fft.fftshift and numpy.fft.ifftshift ARE named in the thread as
    surfaces that inherit np.roll's inefficiency ("numpy.roll (and
    functions that use it such as numpy.fft.fftshift, numpy.fft.ifftshift)
    are inefficient when shift=0 (or axis=())"), and the reporter's
    motivating use case runs through fftshift/ifftshift specifically. No
    separate %timeit for fftshift or ifftshift appears anywhere in the
    dump; only bare np.roll was benchmarked, hence the single entry in
    affected_operations.
  - >-
    Age/version caveat: the issue was opened 2018-11-14 and received
    exactly one comment, from seberg on 2018-12-01 (author_association
    MEMBER); it has had no further activity since, carries no labels, no
    linked PRs anywhere in the dump, and its state field is still "open"
    as of state_at_ingestion. Neither the 54.2 ms baseline nor the 10-20
    microsecond estimate carries a numpy or Python version, and roll's
    internal implementation may well have changed in the intervening
    years; both figures need reverification against current main before
    either is trusted.
  - >-
    Ceiling for a TRANSPARENT layer (verification note, 2026-08-24): the
    claim.speedup above is the thread's own alias-based estimate and is
    UNREACHABLE for PyOverdrive, whose route must return a copy. The
    honest candidate is a plain a.copy() (C-order preserving? np.roll
    returns a C-order copy of the input's values; the reproducer must pin
    order semantics for F-order input too), and its headroom is only
    whatever np.roll's per-axis index machinery costs ON TOP of the copy
    it performs anyway. For the thread's 128 MB array the copy dominates,
    so the realistic factor is expected to be near 1x at large sizes and
    meaningful only for small arrays or the empty-axes path; the Dyno
    reproducer must measure copy-vs-roll, never alias-vs-roll. If the
    measured transparent ceiling is a wash, this record parks with that
    reason, and the alias route stays unshippable regardless of the
    number (seberg's objection above plus the docstring copy contract).
  - >-
    license_review is pending, not clean, because no candidate
    implementation exists anywhere in the dump to review -- only the
    reporter's prose description of what a fast path could do and an
    unverified time estimate, plus the maintainer's explicit reluctance to
    accept this class of optimization at all ("I personally would like to
    keep it at few exceptions," suggesting an `out` argument instead of a
    silent copy-elision).
