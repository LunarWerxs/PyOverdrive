claim:
  speedup: 3613.33
  baseline: >-
    np.roll(r, (), axis=()) on r = np.empty((256, 256, 256)) (a 256x256x256,
    16,777,216-element array; np.empty's default dtype is float64, not
    stated explicitly by the reporter), as timed by the issue author with
    %timeit in the issue body itself: 54.2 ms +/- 3.78 ms per loop (mean
    +/- std. dev. of 7 runs, 10 loops each).
  candidate: >-
    Not a %timeit-verified measurement of committed or patched code. The
    reporter states, immediately after the baseline number, "The time is
    reduced to 10-20 microseconds if a copy is not made" -- an estimate for
    a fast path that returns the input rather than allocating and copying.
    The 3613.33x speedup recorded above is DERIVED using the midpoint of
    that stated range: 54.2 ms / 0.015 ms = 3613.33. The range itself
    spans 2710x at the high (slow) end of the estimate (54.2 ms / 0.020 ms
    = 2710) to 5420x at the low (fast) end (54.2 ms / 0.010 ms = 5420). The
    thread never states a single ratio explicitly, and no benchmark of an
    actual patched implementation appears anywhere in the dump.
  hardware: >-
    unknown; the issue gives no CPU, OS, or numpy/Python version anywhere
    in the dump.
affected_operations: [numpy.roll]
input_regime:
  dtypes: [float64]
  sizes: [16777216]
  notes: >-
    Measured concretely only for the single call np.roll(r, (), axis=())
    on one 256x256x256 float64 array: shift=() together with axis=(), i.e.
    the "empty axes" degenerate case. The issue title and body also
