notes:
  - >-
    Mechanism: np.nanargmax/np.nanargmin are Python-level wrappers that build
    a where(isnan, -inf) (or +inf for nanargmin) masked COPY of the input
    before ever calling argmax/argmin, unconditionally, even when the input
    contains no NaN at all. A single O(n) isnan scan followed by plain
    np.argmax/np.argmin returns the identical index to stock when no NaN is
    present, at the cost of one linear pass instead of a full masked-array
    allocation and copy. When the scan finds a NaN, the candidate falls back
    to stock nanargmax/nanargmin so behavior (including the ValueError stock
    raises on an all-NaN slice) is preserved exactly. numpy/numpy#5691
    ("nanmax strangely slow (3x slower than nanmin)", closed) is cited here as
    the same nan-wrapper class of evidence already ingested for OPP-000041,
    not as a new independent report specific to nanargmax/nanargmin.
  - >-
    Contended supporting evidence only, not part of the claim basis: dev-box
    AMD Zen4 (fp 8f8198d9abab, numpy 2.4.5, 42% foreign load, triage only):
    nanargmax 1-D n=100000 14.17x, 2-D (1000,1000) axis=1 20.83x. These
    numbers are larger than the idle-box figures, which is the expected
    direction, not an anomaly: stock's masked-copy allocation suffers more
    under memory pressure than the candidate's single linear scan, so
    contention widens the gap rather than narrowing it. The idle-box numbers
    remain the citable floor; this dev-box run is kept as corroboration only
    and its fingerprint is deliberately not listed in current_numpy_result.
  - >-
    Correctness risk (medium): stock np.nanargmax/np.nanargmin raise
    ValueError on an all-NaN slice; the candidate's isnan scan must detect
    this case and fall back to stock so the identical ValueError is raised,
    not silently return an index. Tie-breaking on repeated max/min values
    must also match stock's first-occurrence convention exactly, since the
    candidate's plain argmax/argmin call is only valid as a substitute if its
    tie-breaking is identical to stock's own argmax/argmin, which the
    reproducer must confirm cell-by-cell alongside the bit-identical checks
    already run on the idle box.
  - >-
    license_review clean: isnan scan plus plain argmax/argmin is a standard,
    well-known technique (short-circuiting on an already-necessary NaN check
    before falling back to the existing wrapper); no third-party code is
    involved, unlike bottleneck's own C implementation which is out of scope
    and not adapted here.
  - >-
    SHIPPED (2026-08-24) as nanargminmax_scan (src/pyoverdrive/fastpaths/nanargminmax_scan.py): nanargmax_scan/nanargmin_scan, float64, floor 300. All-NaN input re-raises stock's ValueError through the new StockRaised dispatcher protocol (no spurious fast-path-failure warning, no double stock call). Bit-identical. 31 differential tests plus a property suite.
