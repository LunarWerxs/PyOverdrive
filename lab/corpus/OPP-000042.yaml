claim:
  speedup: 26.0
  baseline: >-
    pydata/bottleneck README benchmark table, run on numpy 2.4.2: numpy's own
    np.nanargmax and np.nanargmin timed against bottleneck's C
    implementations. At shape (100,), axis=0: nanargmin speedup factor 25.9x,
    nanargmax speedup factor 26.0x (bottleneck-over-numpy). At shape
    (1000,1000), no-NaN data: both drop to 1.2x. The README frames this gap as
    numpy's Python-level wrapper overhead around plain argmax/argmin, not a
    C-level algorithmic difference, since the gap all but closes once the
    array is large enough that the O(n) work dominates the wrapper's fixed
    cost. No issue number accompanies this source; it is the project's README
    benchmark table, not a numbered GitHub issue or PR.
  candidate: >-
    Not bottleneck's C implementation (out of scope here, third-party code).
    PyOverdrive's own candidate, distinct from the cited claim: a single O(n)
    isnan scan over the input, followed by plain np.argmax/np.argmin when no
    NaN is found, with a fallback to stock np.nanargmax/np.nanargmin when a
    NaN is present. See current_numpy_result below for this candidate's own
    measured numbers, which are PyOverdrive's reproduction evidence, not a
    restatement of the bottleneck figures above.
  hardware: unknown (bottleneck README states only "numpy 2.4.2"; no CPU/OS given)
affected_operations: [numpy.nanargmax, numpy.nanargmin]
input_regime:
  dtypes: [float64]
  sizes: [1000, 10000, 100000]
  notes: >-
    dtype not stated explicitly in either source; float64 follows from
    nanargmax/nanargmin requiring floating-point NaN support and is not an
    invented number. PyOverdrive's own regime (idle Intel box, fp
    9bbe7063c555): 1-D n=1000, n=10000, n=100000, NaN-free; 1-D n=100000 with
    1% NaN present (candidate must fall back to stock); 2-D shape (1000,1000)
    axis=1, NaN-free. bottleneck's own regime (numpy 2.4.2, hardware unknown):
    1-D shape (100,) axis=0; 2-D shape (1000,1000), axis unspecified, no-NaN.
    Zen4 dev-box regime (contended, triage only, not part of the claim basis):
    1-D n=100000 and 2-D (1000,1000) axis=1.
