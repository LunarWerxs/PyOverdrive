id: OPP-000042
title: "np.nanargmax/np.nanargmin: Python wrapper builds a where(isnan,-inf) masked copy before argmax even with no NaN present; isnan-scan-then-argmax reproduces 1.75x-5.34x idle-box, falls back correctly on NaN"
