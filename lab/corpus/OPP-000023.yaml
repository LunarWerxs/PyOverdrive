notes:
  - >-
    GUARD HARDENED (2026-08-24, post-ship): numpy 2.5 fixed
    np.strings.str_len's NUL handling (pure-NUL strings now report their
    true length instead of 0) WITHOUT fixing the isin miss itself, which
    silently blinded the shipped 2.4-era pure-NUL detector - on 2.5.2
    the predicate accepted pure-NUL inputs and the hash route diverged
    from stock (True where stock says False; reproduced in a fresh
    numpy 2.5.2 venv and caught independently by the property net on
    the Docker Linux leg). The detector is now chosen at import by
    probing the running numpy against a known-answer array
    (count-with-np-scalar-needle on 2.5+, zero-len-but-not-empty on
    2.4.x, a Python scan as the unfoolable fallback). Extra upstream
    facet found while fixing: a PYTHON "\x00" scalar C-truncates to ""
    inside np.strings.count/replace/strip on BOTH 2.4.5 and 2.5.2,
    while a 0-d StringDType array needle works - drafted for upstream in
    docs/research/upstream-nul-stringdtype.md.
  - >-
    SHIPPED (2026-08-24) as isin_string_hash
    (src/pyoverdrive/fastpaths/isin_string_hash.py): both operands plain
    1-D default StringDType (na_object-carrying dtypes refused), kind
    absent, combined size >= 300, routed to a Python hash set - exact
    string equality, bit-identical, invert/assume_unique accepted.
    End-to-end 240x at n=3000 card-3 self-isin even at smoke size.
    DISCOVERED IN TESTING, guarded and recorded: stock numpy 2.4.5 isin
    MISSES strings made only of NUL characters even when present
    (embedded NULs match fine; np.strings.str_len reports 0 for pure-NUL
    strings, the same C-truncation likely causing it) - the fast path
    would answer correctly, so pure-NUL inputs are refused to stay
    bug-for-bug faithful while stock's behavior is in flux. Upstream
    report candidate.
  - >
    maintainer_objections is empty because the thread has zero comments in
    the dump, not because objections were filtered out. The reporter
    ngoldbaum carries author_association MEMBER, so the diagnosis and the
    proposed fixes are themselves maintainer-sourced even with no replies.
    ikrommyd is @-mentioned in the body but had not responded as of
    retrieval.
  - >
    Root cause per the issue body: "both object arrays and stringdtype fall
    back to the `hasobject` path in the `_isin` helper" (the body links
    numpy/lib/_arraysetops_impl.py lines 910-926 at commit 30483388), and
    "This slow path is much much slower than the sorting path." The
    reporter calls it "more-or-less the same issue as"
    numpy/numpy#14997, the long-standing object-array isin complaint. The
    O(n*m) characterization used in this record's lead is derived from the
    shape of that linked fallback (a per-test-element comparison loop over
    the full element array); the thread itself does not use big-O language.
  - >
    The reporter proposes three upstream routes in the body: (1) "an easy
    fix ... to change the predicate in `_is_in` to allow stringdtype to use
    the sorting path if it has no `na_object` or `na_object` is a string",
    with "nan-like or None-like missing data" still falling back to the
    slow object path; (2) "implement a hash-based `isin` for stringdtype
    that uses the existing hash-based unique infrastructure", which he
    thinks cannot be done for object arrays except perhaps opt-in "via a
    keyword argument"; (3) borrowing from numpy/numpy#31969, "use
    HyperLogLog to switch between sorting and hashing to determine set
    membership with an optimal choice for the dataset's estimated
    cardinality".
  - >
    Upstream is already moving: draft PR numpy/numpy#32217 "ENH: speed up
    StringDType isin" by ngoldbaum (opened 2026-08-06, still marked draft
    at its last recorded update 2026-08-20) says "Fixes #32161. Opening as
    a draft for now while I test it." Before any PyOverdrive ship, check
    whether the installed numpy already contains the merged fix; this
    opportunity is likely version-bounded to numpy releases predating that
    merge, and the Dyno run must record which side of it the measured
    numpy sits on.
  - >
    The transparent fast path this record recommends: intercept np.isin
    when either argument is StringDType and the dtype instance either has
    no na_object or has a string na_object (the reporter's own predicate),
    then route to a semantics-preserving fast membership test - either the
    sorting path the U cast already reaches, or a hash-set membership pass -
    returning the same boolean array stock returns. Configured nan-like or
    None-like na_object must fall back to stock, exactly as the reporter
    says upstream would have to. Hazards concentrating the correctness
    risk: na_object equality semantics on the fallback boundary, the
    invert/assume_unique/kind keyword surface of np.isin passing through
    unchanged, and a U-cast route needing the max string length first
    (memory blowup on long-string arrays argues for the hash route
    instead).
  - >
    The measured regime is a best case for any set-based method: extreme
    low cardinality (3 unique values among 30000) and element ==
    test_elements. The Dyno reproducer must sweep cardinality (3, ~100,
    ~n distinct values), element count, string length, and disjoint
    element/test arrays before the claim number is treated as
    representative; the 143.53 figure comes from that single
    low-cardinality self-isin point.
