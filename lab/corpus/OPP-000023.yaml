id: OPP-000023
title: "np.isin on StringDType falls back to the slow object-array path, ~144x slower than the U-dtype sorting path"
sources:
  - url: https://github.com/numpy/numpy/issues/32161
    repository: numpy/numpy
    type: issue
    number: 32161
    state_at_ingestion: open
    retrieved_at: "2026-08-24T03:32:43Z"
claim:
  speedup: 143.53
  baseline: >
    np.isin(a, a) with a = np.array(['abcd'*5, 'defg'*5, 'abhoj'*6] * 10**4,
    dtype='T'), i.e. a 30000-element StringDType array holding only 3
    distinct strings, tested against itself; the reporter's own script times
    it with timeit at number=1 and prints 2.9416205829475075 s. The 143.53
    figure is DERIVED, not quoted from the thread; the derivation is
    2.9416205829475075 / 0.020494583994150162 = 143.53. The thread's own
    framing of the gap is qualitative only ("So `StringDType` is
    orders-of-magnitude slower."); no explicit ratio appears in the dump.
  candidate: >
    the identical call after casting both arguments to fixed-width unicode,
    np.isin(a.astype('U30'), a.astype('U30')), which takes the sorting path
    instead of the hasobject fallback; the same script prints
    0.020494583994150162 s for it. The astype('U30') casts run inside the
    timed lambda, so the candidate timing already pays the conversion cost;
    the sort-path advantage net of conversion is understated if anything.
  hardware: >
    unknown; the reporter says only "On my laptop, this outputs". No CPU,
    OS, RAM, or numpy version appears anywhere in the dump.
affected_operations: [numpy.isin]
input_regime:
  dtypes: [StringDType]
  sizes: [30000]
  notes: >
    The one measured configuration is a 30000-element 1-D StringDType array
    (3 distinct strings of lengths 20, 20, and 30, tiled 10**4 times) passed
    as BOTH element and test_elements arguments (np.isin(a, a)), so the
    slow-path work scales with the full 30000-element test array even though
    unique cardinality is 3. The comparison dtype is fixed-width 'U30'. No
    other size, cardinality, string length, or disjoint element/test
    configuration is measured in the thread.
