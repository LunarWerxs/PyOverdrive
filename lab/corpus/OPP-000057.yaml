notes:
  - >-
    THE BARE NUMBER IS NOT THE NUMBER, and this is the opportunity that
    proves it. The no-constant route allocates with np.zeros, i.e.
    calloc, so timing the pad call alone banks pages the caller has not
    faulted in yet. A small array with a huge zero pad measures 342x
    bare on the idle box and 0.86x once the result is summed - a
    REGRESSION that would have shipped as the largest speedup in the
    project had the cap been set from bare timings. Every margin quoted
    here is therefore CONSUMED, and BATCH13-CAL keeps the refused
    over-cap cells measured both ways so the crossing is standing
    evidence rather than an assertion.
  - >-
    THE CAP IS ON THE OUTPUT LENGTH, NOT THE INPUT LENGTH, for the same
    reason: a tiny array with an enormous pad is precisely the shape
    that looks best bare and performs worst used, and a cap on input
    size alone would admit it.
  - >-
    THREE TRAPS THAT np.array_equal CANNOT SEE, which is why the
    differential suite compares raw bytes. (1) constant_values=-0.0
    fills with NEGATIVE zero while np.zeros fills with positive zero, so
    the np.zeros route is gated on constant_values being ABSENT rather
    than merely equal to zero. (2) The constant must become a NUMPY
    SCALAR, as _as_pairs produces: a 0-d array agrees with stock on
    wrapping -1 into uint8 and DISAGREES on NaN into an integer array,
    where it silently writes INT_MIN under a RuntimeWarning instead of
    raising ValueError. An earlier build used np.asarray and so turned a
    stock exception into a wrong answer; hypothesis found it. (3) A
    zero-width pad on both sides writes the constant only into empty
    slices, so the cast never happens and an invalid constant would
    quietly succeed; that degenerate call is refused.
  - >-
    A STRING ARRAY IS PADDED BY STOCK WITH THE STRING "0", not with the
    empty string np.zeros produces. Shapes and dtypes agree, so only a
    value comparison catches it - the reason the dtype allowlist is an
    allowlist and not a kind check.
  - >-
    THE PREDICATE IS PART OF THE COST. The raw route measures 7.7x
    consumed at n=64; the shipped route measured 3.5x, because the
    normalization runs twice per call (predicate, then run) and a single
    np.asarray costs about as much as the pad it prepares. Fast-pathing
    the two spellings that dominate real traffic - a plain int and a
    2-tuple of ints - took it to 4.46x without changing what is accepted
    or refused. A guard that is cheap to describe is not automatically
    cheap to run.
  - >-
    THE SHORTLIST HEADLINE WAS UNBACKED. The batch-11 panel recorded
    "13.9x dev / 15.2x idle at n=64" for this opportunity, and there was
    no results cell and no bench script behind it. Re-measuring
    reproduced 13.9x exactly - as a BARE timing of a raw route, which is
    neither what ships nor what a user experiences. The honest figure is
    4.46x. Treat any shortlist number without a committed fingerprinted
    cell as a lead, not as evidence.
