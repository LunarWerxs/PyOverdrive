notes:
  - >-
    SIBLING SHIPPED (2026-08-24) as percentile_dense
    (src/pyoverdrive/fastpaths/percentile_dense.py): numpy.percentile
    with a dense q array in [0, 100], sharing this record's predicate
    floors and sort+lerp run with numpy's own q/100 scaling. Its OWN
    battery (PERCENTILE-CAL, fp 9bbe7063c555, 0% load) measured 1.83x
    at nq=4 up to 805.8x at nq=16384 of 65536, every cell BIT-EXACT
    against stock percentile.
  - >-
    SHIPPED (2026-08-24) as quantile_dense_sort
    (src/pyoverdrive/fastpaths/quantile_dense_sort.py): quantile(a, q)
    with a 1-D float64 q ARRAY (4-16384 entries), float64 a, 1-D or
    2-D last-axis, reduced length 512-65536, method linear - sorted once
    then numpy's own virtual-index/lerp arithmetic replicated exactly,
    bit-identical including NaN-salted and inf-salted slices (probed and
    battery-checked). The QUANTILE-CAL battery justified dispatching far
    below the cliff: the sort route wins at EVERY measured cell (1.80x
    at nq=4, 918x at nq=16384 of 65536, 1-D 2.7-790x), so the floor is
    min-win-derived, not cliff-derived. np.partition/argpartition
    surfaces from the record stay unshipped: returning a fully-sorted
    array satisfies partition's documented contract but is not
    elementwise-identical to stock's output, which needs a new
    comparison mode before it can ship honestly.
  - >
    The transparent fast-path shape: intercept np.quantile/np.percentile
    calls where the number of distinct kth indices the interpolating
    method will request (up to 2*len(q)) crosses the density threshold
    (kth spacing < 4, i.e. roughly len(kth) > m/4 for linear), and route
    to one full np.sort along the axis plus numpy's exact interpolation
    arithmetic, replicating _quantile's lerp (including its gamma >= 0.5
    stability rewrite) the way OPP-000013's shipped nanquantile path
    already does. The order statistics a sorted array yields are by
    definition the ones partition would have placed, so the only
    correctness surface is matching the interpolation bit-for-bit, which
    is why correctness_risk is low. The reporter's own manual_quantile
    baseline in the issue body is exactly this route, minus the exact-lerp
    discipline.
  - >
    Root cause per the thread (from the Claude-generated analysis posted
    by eendebakpt): introselect in numpy/_core/src/npysort/selection.cpp
    has a dumb_select fast path for kth - low < 3, an O(range * (kth -
    low)) selection scan that neither partitions the data nor stores
    pivots. Multi-kth partitions process sorted kth values left to right,
    and once consecutive kth values are less than 4 apart every kth takes
    this path, each re-scanning essentially the whole remaining tail, so
    the overall partition degrades to O(n^2) per lane.
  - >
    Upstream-fix risk: eendebakpt already has a branch
    (https://github.com/eendebakpt/numpy/tree/fix/partition-dense-kth, one
    condition change in introselect_ plus threading the nkth argument)
    that takes the spacing-2 case from 496 ms (21x sort) to 41 ms (1.7x
    sort). No PR is filed in the dump and the issue is open at retrieval.
    If that fix merges, the headline win collapses from ~21x to the
    residual ~1.7x at that shape; but the same comment notes that even
    fixed, the multi-kth path stays scalar while sort uses SIMD
    (x86-simd-sort) on x86, so a sort-instead-of-partition heuristic in
    _quantile "could still be a small follow-up win on SIMD hardware".
    The Dyno run must therefore test the numpy actually installed and
    report which side of the fix it is on.
  - >
    Provenance flag: the issue body carries the reporter's own disclaimer
    ("This issue was written by Claude, but I reviewed it and ran the
    code"), and the root-cause/fix analysis in the confirming comment is
    explicitly marked by eendebakpt as generated by Claude. Every number
    in this record traces to that confirming comment; treat all of them
    as single-machine, single-run figures until the Dyno reproducer
    replaces them.
  - >
    Semantics hazards for the quantile-level route: method= variants other
    than linear map virtual indices differently and some (nearest,
    lower/higher, inverted_cdf) request only one index per quantile,
    shifting the density threshold; weights= is only accepted for
    inverted_cdf; NaN propagation, out=, overwrite_input=, keepdims and
    tuple axis must all behave identically. A partition-level route (for
    ndarray.partition itself) is stricter: a fully sorted array satisfies
    partition's documented guarantee, but the bytes in the unspecified
    regions would differ from stock output, an observable divergence to
    weigh before routing anything other than quantile.
