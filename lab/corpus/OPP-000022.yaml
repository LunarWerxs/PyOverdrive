id: OPP-000022
title: "Dense multi-quantile np.quantile requests hit an ndarray.partition density cliff and run 21x slower than a full sort"
sources:
  - url: https://github.com/numpy/numpy/issues/32187
    repository: numpy/numpy
    type: issue
    number: 32187
    state_at_ingestion: open
    retrieved_at: "2026-08-24T03:32:41Z"
claim:
  speedup: 21.0
  baseline: >-
    ndarray.partition on a (2048, 300) float64 array, partitioning along the
    length-2048 axis, with kth spacing 2 (len(kth)=1024), on unpatched numpy
    main (scalar build), as measured by eendebakpt in the confirming comment
    (2026-08-04) and reported as "496 ms (21x sort)". This is the dense-kth
    regime np.quantile itself creates for many-quantile method="linear"
    calls, since it requests two neighbor indices per quantile.
  candidate: >-
    full ndarray.sort on the same array and axis, from the same measurement
    table in the same comment. The 21x is the comment's own reported
    partition-vs-sort ratio (496 ms partition against an implied ~23.6 ms
    sort, derived as 496/21); it is the most concrete measured number in
    the thread. No np.quantile-level ratio is reported anywhere in the
    dump - the issue body's part 1 script prints a quantile-vs-manual-sort
    ratio table but its output does not appear in the thread.
  hardware: >
    unknown; the 21x measurement comes from eendebakpt's comment, which
    states only "scalar build, A/B against unpatched main" and gives no
    CPU or machine spec. The reporter's own environment block (attached to
    the repro scripts, whose output is not shown in the thread) gives
    numpy 2.3.5, Python 3.13.9 (Anaconda, Clang 20.1.8), Darwin arm64
    (Apple T8103, NEON/ASIMD SIMD baseline).
affected_operations: [numpy.quantile, numpy.partition, numpy.argpartition]
input_regime:
  dtypes: [float64]
  sizes: ["(300, 2048)", "(2048, 300)"]
  notes: >
    The reporter's part 1 sweeps np.quantile(a, q, axis=-1,
    method="linear") on a (300, 2048) standard-normal array with nq/m in
    {0.05, 0.10, 0.20, 0.24, 0.25, 0.30, 0.50}; part 2 isolates
    ndarray.partition on (2048, 300) along axis 0 with evenly spaced kth at
    densities 0.05 through 1.00. Per eendebakpt's confirming comment, the
    cliff is at kth spacing < 4 (len(kth) exceeding roughly a third of the
    array length), and np.quantile hits it at nq/m of about 0.25 because
    the linear method requests two neighbor indices per quantile, halving
    the effective spacing. Scaling at spacing 2 is quadratic per lane on
    unpatched numpy, "47 -> 2672 ms" from 1k to 8k rows, i.e. roughly 4x
    per array-size doubling. Only float64 timings appear in the thread.
