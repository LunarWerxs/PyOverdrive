notes:
  - >-
    Bit-identical on every served call; the split above is what makes
    that claim true rather than approximately true. The differential
    suite re-proves the split on whatever machine it runs, in both
    directions (exact reducers dispatch off the last axis and agree;
    order-sensitive ones REFUSE off the last axis).
  - >-
    The identity lookup is rebuilt on the gearbox's patch generation
    counter, and this is load-bearing: PyOverdrive patches np.mean and
    np.sum themselves, so while enabled the caller's np.mean IS
    PyOverdrive's wrapper. The first build of this path matched only
    the pre-patch objects, so it silently never fired - caught by its
    own selfcheck, which is exactly what selfcheck is for. The lookup
    maps both the wrapper and the stock object to the STOCK reducer,
    so the result is exactly stock-apply_along_axis's and needs no
    second dispatch.
  - >-
    Wrapper edges refused rather than assumed, each read from numpy's
    implementation and tested: a zero-length non-axis dimension (stock
    raises ValueError where the axis= form returns empty); a
    zero-length axis dimension (stock's per-slice warning behavior
    cannot be reproduced by one call); np.matrix, where stock's own
    answer is shape-wrong because matrix slices never become 1-D, so
    the axis= form is different-and-arguably-better - precisely what a
    transparent accelerator must not be; other ndarray subclasses;
    1-D input, where stock returns a 0-d ndarray and the axis= form a
    bare NumPy scalar (the path re-wraps so the TYPE matches too).
  - >-
    license_review clean: routes to numpy's own reductions, no
    third-party code, no algorithm reimplemented.
  - >-
    SHIPPED (2026-08-25, batch 11) as apply_along_axis_reduce.
