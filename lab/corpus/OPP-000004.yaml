notes:
  - "No numpy core maintainer has triaged or commented on this issue as of retrieval (2026-08-23); it remains open, unlabeled, with only two community replies, opened 2022-06-03."
  - "Neither commenter (baumdan1, stevengj) is a numpy core maintainer, so maintainer_objections is empty by absence of maintainer engagement, not by absence of concerns; treat this as unreviewed rather than approved."
  - "stevengj (FFTW author) recommends a recursive cache-oblivious tiling over hand-tuned block sizes for portability, and flags that FFTW's own tiled out-of-place transpose code is GPL-licensed and must not be copied into numpy."
  - "The reporter's proposed API, numpy.asorder(a, order, inplace=False), was never implemented; no PR followed this issue."
  - "The reporter also flags a possibly separate bug: a.reshape(a.shape, order='F') returns a C-order (row-major) result, not F-order; unconfirmed and out of scope for this record."
  - "The threaded candidate in the issue is Python-level (ThreadPoolExecutor over numpy slice assignments), not a native kernel; a real win likely needs a C/SIMD tiled transpose released from the GIL, which is the native-kernel angle this record is scoped to surface a baseline for."
