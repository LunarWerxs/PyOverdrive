notes:
  - >-
    SHIPPED (2026-08-24) as eigvalsh_2x2_closed
    (src/pyoverdrive/fastpaths/eigvalsh_2x2.py): numpy.linalg.eigvalsh on
    plain float64/float32 (..., 2, 2) batches of at least 100 matrices,
    UPLO absent or 'L', all elements finite (LAPACK raises LinAlgError
    where a closed form would return NaN, so non-finite stays on stock).
    Floors from OPP-000030 + BATCH4-CAL (batch 10 loses 0.67x, 30
    straddles 1.11x, 100 wins 2.51-2.55x). Comparison mode numeric at
    the abs-error-vs-||A|| standard LAPACK itself promises. Full eigh
    remains unshipped: eigenvector sign freedom has no honest
    elementwise comparison contract (the np.partition blocker class);
    the closed-form vectors clear a reconstruction-contract check at
    1.4-1.8x, recorded for a future contract-comparison mode.
    license_review clean: closed-form quadratic from first principles.
  - >-
    Mechanism, per seberg's comment (the only comment on the thread,
    2022-09-02, author_association MEMBER): both eig and eigh likely call
    into openblas (or whichever LAPACK backend) in a per-matrix loop over
    the batch; for small matrices the wall time is dominated by per-call
    setup/overhead rather than FLOPs, and seberg is explicit he does not
    know whether that overhead differential lives in NumPy's own code or
    in the backend, and that "linear algebra backends are like not
    optimized for these small cases." No root cause was ever isolated in
    the thread and no profiling was posted.
  - >-
    Transparent fast-path sketch: numpy.linalg.eigh is a patchable
    module-level name, so a dispatch wrapper can check the predicate
    "input is stacked (..., 2, 2), real or complex dtype, UPLO default
    ('L'), no out= argument" and route matching calls to a closed-form 2x2
    symmetric/Hermitian eigendecomposition (eigenvalues via the quadratic
    formula on trace/determinant, eigenvectors via the standard 2x2
    closed-form null-space construction) instead of calling into LAPACK's
    batched syevd/heevd path. Everything else falls through to the
    existing numpy.linalg.eigh unchanged.
  - >-
    Correctness hazards for that sketch, not resolved by anything in the
    thread: (1) eigenvector SIGN is not fixed by the symmetric
    eigenproblem itself, LAPACK's syevd/heevd picks a sign/normalization
    convention internally that a from-scratch closed-form derivation is
    not guaranteed to reproduce, so a bitwise or even sign-exact match
    against current numpy.linalg.eigh output cannot be assumed without
    an explicit sign-fixing rule matched to LAPACK's convention. (2)
    UPLO handling: numpy.linalg.eigh reads only one triangle (upper or
    lower per the UPLO argument) and ignores the other; a closed-form
    route must replicate that exact triangle-selection behavior (and its
    interaction with the implicit symmetrization LAPACK performs) rather
    than assuming the matrix is already symmetric, or it will silently
    diverge from LAPACK on inputs that are only symmetric in the read
    triangle. (3) near-degenerate eigenvalues (trace^2 ~= 4*det) are a
    known numerical-stability edge case for closed-form 2x2 solutions
    that iterative LAPACK routines handle differently; the thread's
    random.rand-generated test matrices do not probe this case.
  - >-
    Ship-surface note (verification pass, 2026-08-24): the eigenvector
    sign hazard in the previous note does NOT apply to
    numpy.linalg.eigvalsh, whose output (ascending eigenvalues only) is
    mathematically unique for a given input - no sign convention, no
    basis freedom outside exact degeneracy. eigvalsh is an equally
    patchable module-level name and shares the same per-matrix LAPACK
    overhead, so the closed-form quadratic route
    ((tr +/- sqrt((a-d)^2 + 4*b^2))/2 for a real symmetric [[a, b],
    [b, d]], reading only the UPLO triangle) is comparable against stock
    NUMERICALLY, slice by slice. The Dyno reproducer should therefore
    measure BOTH surfaces: eigvalsh (the likely shippable one) and full
    eigh (headroom documentation; shippable only if a defensible
    comparison contract for eigenvectors exists, which today it does not
    - same class of blocker as np.partition in OPP-000022's notes).
  - >-
    Age/version caveat: the issue was opened 2022-08-20 against numpy
    1.21.5 and closed 2022-09-02 (state "closed", state_reason
    "completed", closed_by the reporter themself, not a maintainer,
    comments=1, no linked PR anywhere in the issue or comment dump, no
    "57 - Close?" discussion beyond the label itself). Several numpy
    major/minor releases and at least one BLAS/LAPACK backend default
    change (OpenBLAS version bumps) have shipped since. This record must
    check whether the small-batch eigh-vs-eig gap still reproduces on
    current numpy before treating it as a live opportunity; the gap
    having closed on its own (e.g. via later openblas or numpy dispatch
    changes) is a legitimate and expected reproducer outcome, not a
    reproducer failure.
  - >-
    license_review is pending, not clean: unlike the eig-vs-eigh timing
    comparison in the issue (pure use of existing numpy public API, no
    licensing question), the RECOMMENDED fast path is new closed-form
    code that has not been written or sourced yet, so there is nothing to
    review for license provenance until an implementation exists.
  - >-
    Measurement-quality caveat carried into claim.speedup: every ratio in
    this record comes from single perf_counter() calls printed as
    approximate code comments ("gives ~ 0.7" etc.) in the reporter's own
    script, not from repeated-trial %timeit output with error bars (contrast
    OPP-000024, which had explicit mean +/- std over thousands of loops).
    Treat 1.43 as a rough, unreplicated signal of direction and order of
    magnitude, not a precise baseline.
