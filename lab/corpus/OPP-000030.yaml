implementation_risk: medium
maintainer_objections:
  - author: seberg
    date: "2022-09-02"
    quote: >-
      Would have to dig into the code to figure this out. I suspect both
      end up calling openblas in a tight loop on each of the small
      matrices. For small matrices such an approach would be dominated by
      overheads (setting things up, and just the function calls). So if
      those differ for whatever reasons, the results are not unexpected.
      However, I am not sure whether the overheads differ due to code in
      NumPy or due to code in openblas (or whichever linear algebra
      backend is used). Linear algebra backends are like not optimized
      for these small cases.
