id: OPP-000030
title: "numpy.linalg.eigh runs slower than eig when broadcasting many small (2x2) symmetric matrices"
sources:
  - url: https://github.com/numpy/numpy/issues/22158
    repository: numpy/numpy
    type: issue
    number: 22158
    state_at_ingestion: closed
    retrieved_at: "2026-08-24T07:00:00Z"
claim:
  speedup: 1.43
  baseline: >-
    numpy.linalg.eigh on a batch of 1000 stacked 2x2 real symmetric matrices
    (np.random.rand(1000, 2, 2) forced symmetric via a.transpose(0,2,1) @ a),
    per the issue author's own reproducer script, section "1.3) using 1000
    arrays". The script times fun1=np.linalg.eig then fun2=np.linalg.eigh
    with single perf_counter() calls (no repetition, no %timeit, no error
    bars) and prints t1/t2; the code comment against this case reads
    "# gives ~ 0.7", i.e. time(eig)/time(eigh) ~= 0.7, so eigh took longer
    than eig. This is a single-shot, low-precision measurement, not a
    calibrated benchmark.
  candidate: >-
    numpy.linalg.eig on the identical 1000x(2,2) batch, same reproducer
    script, same "# gives ~ 0.7" comment. eig is not a proposed fast-path
    implementation; it is the thread's own faster reference point,
    demonstrating that a specialized route for this shape has headroom.
    Speedup DERIVED from the reporter's own ratio: the comment gives
    time(eig)/time(eigh) ~= 0.7, so eigh/eig = 1/0.7 = 1.42857... ~= 1.43.
    A second batch point in the same script, "1.2) using 200 arrays", gives
    "# gives ~ 0.9", i.e. eigh/eig = 1/0.9 = 1.11x, a smaller but same-
    direction gap. Both are approximate, single-run numbers from code
    comments, not measured output.
  hardware: >-
    NumPy/Python version stated in the issue's version block: "1.21.5 3.9.7
    (default, Sep 16 2021, 16:59:28) [MSC v.1916 64 bit (AMD64)]", i.e.
    numpy 1.21.5, Python 3.9.7, Windows, MSVC-built, 64-bit AMD64. No CPU
    model, core count, or OS build is given anywhere in the issue or its
    single comment.
affected_operations: [numpy.linalg.eigh, numpy.linalg.eigvalsh]
input_regime:
  dtypes: >-
    float64 (np.random.rand default), real symmetric matrices forced via
    a.transpose(0, 2, 1) @ a. The thread never exercises a complex/Hermitian
    input.
  sizes: [2, 100]
  notes: >-
    Matrix side length d and batch/broadcast count are both varied in the
    reproducer, and only the crossing of the two produces the bug. For
    d=2: single array ratio time(eig)/time(eigh) ~= 3 (eigh faster, the
    expected case per the issue title and per seberg's framing); 200
    arrays ~= 0.9 (eigh already slower, 1.11x DERIVED); 1000 arrays ~= 0.7
    (eigh slower, 1.43x DERIVED). For d=100: ratio stays ~= 4 (eigh faster)
    at 1, 200, and 1000 arrays alike, i.e. no crossover was observed for
    the larger matrix size at any tested batch count. The regime this
    record targets is therefore specifically small (the issue singles out
    2x2 as "the most noticeable case") matrices broadcast in bulk, not
    small matrices in general.
status: performance_validated
license_review: clean
reproducer: benchmarks/historical/opp_000030_eigh_small_batch.py
current_numpy_result:
  verified_speedup: null
  fingerprints: [9bbe7063c555]
  detail: >
    Full Dyno run 2026-08-24, idle Intel box (fp 9bbe7063c555, numpy
    2.5.2, 0% load): REPRODUCED far above the claim's 1.43x headroom
    signal. A closed-form quadratic on the lower triangle beats
    numpy.linalg.eigvalsh (values-only, output mathematically unique, no
    sign hazard) at every batch size from 100 up: 2.51x at 100, 12.6x at
    1000, 31.2x at 10_000, 6.6x at 100_000, 5.9x at 1_000_000; batch 1
    loses (0.46x). The 1e12-condition witness batch passed the scaled
    tolerance at 30.7x (tolerance is scaled to each matrix's largest
    |eigenvalue|, the same absolute-error standard LAPACK promises). Full
    eigh via closed form clears the CONTRACT check (residual within 10x
    of stock's, orthonormal) at 1.81x/1.40x but eigenvector SIGN freedom
    still blocks an elementwise ship contract, so eigvalsh is the ship
    surface and eigh stays documentation. Evidence:
    benchmarks/results/OPP-000030/9bbe7063c555.json.
main_branch_result: null
