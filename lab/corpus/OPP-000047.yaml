    benchmarks/results/BATCH7-CAL/9bbe7063c555.json):
    2x2 - batch=300: 1.21x, 1000: 1.84x, 2000: 2.11x, 3000: 2.24x,
    5000: 2.39x, 20000: 1.29x.
    3x3 - batch=300: 0.93x, 1000: 1.45x, 2000: 1.75x, 3000: 1.84x,
    5000: 0.98x, 20000: 0.94x.
    RAW algorithm without the guard (reproducer,
    benchmarks/results/OPP-000047/9bbe7063c555.json): 2x2 2.70x at 100,
    7.76x at 1000, 11.79x at 5000, 2.98x at 20000; 3x3 1.42x at 100,
    3.95x at 1000, 5.51x at 5000, 2.30x at 20000 - the gap between raw
    and guarded is the conditioning guard's cost, exactly as in
    OPP-000045. Dev-box probe (AMD Zen 4, numpy 2.4.5, contended,
    triage-only): 2x2 9.95x at 10_000; 3x3 ~2x at 10_000-100_000; max
    closed-form error 3.6e-17 of per-matrix scale.
