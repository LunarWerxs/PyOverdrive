notes:
  - >-
    Comparison mode: numeric, NOT bit-identical (battery-checked at rtol
    1e-9 scaled; measured max error 3.6e-17 of scale). The closed form
    reads ONLY the lower triangle, exactly like stock potrf UPLO='L'
    (numpy documents that the upper triangle is ignored), and writes
    exact 0.0 into the strict upper triangle of the result like stock.
  - >-
    The positivity guard (each factorization pivot >= PIVOT_RTOL=1e-8
    times the per-matrix max-|entry| scale) does triple duty: it refuses
    non-positive-definite input (stock raises LinAlgError; an unguarded
    closed form would sqrt a negative), refuses the near-semidefinite
    boundary band where LAPACK's own rounding decides raise-vs-succeed,
    and bounds conditioning so the closed form's rounding stays at the
    measured 1e-17-of-scale level. Same DET_RTOL-style policy as the
    shipped OPP-000035/OPP-000045 guards.
  - >-
    scipy/scipy#24474 is used strictly as demand-and-mechanism evidence
    for the batched small-matrix linalg surface: it is scipy's own
    maintainer-driven program to make batched small-matrix decompositions
    fast, currently open, with cholesky nowhere singled out in-thread.
    Nobody there proposes closed-form vectorization; the closest
    structural finding is BasilLiekens' (2026-07-31) LAPACK-driver
    observation for eigh (numpy uses evd, scipy defaulted evr; switching
    "brought the difference... down to noise level"), which is
    driver-selection, not de-LAPACKing.
  - >-
    license_review clean: Cholesky-Crout is a textbook factorization
    formula; no third-party or reporter-owned code involved.
  - >-
    correctness_risk medium for the same reasons as OPP-000045
    (raise-vs-succeed parity at the PD boundary, conditioning-amplified
    rounding), both handled by the pivot guard. implementation_risk low:
    fixed-size branch-free formulas.
  - >-
    SHIPPED (2026-08-24, batch 7) as cholesky_small_batch
    (src/pyoverdrive/fastpaths/cholesky_small_batch.py): float64
    (...,2,2)/(...,3,3) stacks, windows {2: [1000, inf), 3: [1000, 3000]}
    from the BATCH7-CAL cells above, pivot guard, kwargs (including numpy
    2.x upper=) refused. 22 differential tests plus a property net with
    non-PD / non-finite / asymmetric-upper hazards.
  - >-
    BATCH 9 REWRITE (2026-08-24): the guard pivots ARE the factorization's
    intermediates (p2 = a22 - l21^2, p3 = a33 - l31^2 - l32^2), so the
    predicate-then-recompute double pass was fused into one guarded
    factorization pass, run in cache-sized chunks (2x2 always 4096; 3x3
    chunk 1024 below batch 30_000, 4096 above - both boxes show a narrow
    chunk-4096 resonance around batch 10_000 for 3x3 only, 1.11x idle /
    1.23x dev, recovered by 16_384). Guard refusal now hands the whole
    call to stock mid-run (StockRaised pattern), so decision reads PATH
    with stock's exact behavior. BATCH9-CAL idle-box cells (fp
    9bbe7063c555, 0% load) under the policy: 2x2 1.86-2.30x at 1000-1M
    (the old route's weakest admitted cell, 1.29x at 20_000, now 2.30x);
    3x3 1.59-1.90x at 1000-10_000 and 1.66-1.88x at 16_384-1M; dev box
    agrees at every cell (1.46-2.00x). Both windows now floor 1000, NO
    CAP: the old 3x3 cap at 3000 (forced by the unfused route's bistable
    5000 cell) is lifted - that cell reads 1.90x idle / 1.92x dev fused.
    The bench note's projected ~5x at batch >=5000 did NOT survive honest
    guard pricing (that number was raw unguarded Crout); the honest
    large-batch win is the 1.6-1.9x recorded here.
