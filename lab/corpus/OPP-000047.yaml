id: OPP-000047
title: "numpy.linalg.cholesky on 2x2/3x3 batched stacks: per-matrix LAPACK potrf dispatch loses to a vectorized Cholesky-Crout closed form inside a measured batch window (1.8-2.4x guarded end-to-end, 2.7-11.8x raw algorithm); third member of the shipped small-batch linalg family (OPP-000035 inv, OPP-000045 det/slogdet/solve)"
sources:
  - url: https://github.com/scipy/scipy/issues/24474
    repository: scipy/scipy
    type: issue
    number: 24474
    state_at_ingestion: open
    retrieved_at: "2026-08-24T08:59:04Z"
claim:
  speedup: null
  baseline: >-
    No one in the source thread benchmarks numpy's cholesky against a closed
    form; the thread is DEMAND-AND-MECHANISM evidence, not a prior claim of
    this technique. ev-br (scipy maintainer, issue body, 2026-01-31) frames
    the whole effort: scipy's batched-ND linalg support (scipy#21466,
    landed 1.16.x) is being moved to low-level C because "This improves
    performance, esp for batches of small matrices", with a checklist of
    decompositions (det, lu, norm, the solve family, eigh) to bring to
    "comparable performance" with numpy.linalg. rgommers (2026-07-29)
    quantifies the stakes for one member: "if there are cases where scipy
    is almost 10x slower than numpy, as in the first eigh benchmark
    here... porting to C/C++... looks like the desired end state."
  candidate: >-
    PyOverdrive's candidate is not from the thread: explicit Cholesky-Crout
    formulas for d=2/d=3 vectorized across the whole stack, never calling
    LAPACK, measured separately under current_numpy_result. The thread
    corroborates the underlying mechanism instead: batched small-matrix
    decompositions are dominated by per-call machinery rather than
    flops - ilayn (2026-07-29): numpy wins because it is "good at quickly
    getting down to the compiled internals and no or very little checks
    are applied", i.e. even scipy's COMPILED loops lose to overhead
    differences at these sizes, and numpy's own per-matrix potrf gufunc
    loop is the same class of overhead one level down.
  hardware: >-
    Not stated per-benchmark in the dump; the scipy thread's numbers are
    BasilLiekens' eigh benchmarks (2026-08-03, OPENBLAS_NUM_THREADS=1).
affected_operations: [numpy.linalg.cholesky]
input_regime:
  dtypes: [float64]
  sizes: [1000, 2000, 3000, 5000, 20000]
  notes: >-
    Stacked 2x2 and 3x3 SPD matrices only. Unlike the det/slogdet/solve
    siblings this one has a measured WINDOW, not just a floor: 2x2 wins
    from batch 1000 with no cap, but 3x3 wins only in [1000, 3000] on the
    calibration box - at batch >= 5000 the strided closed-form writes go
    memory-bound and LAPACK catches up (5000 measured bistable across
    runs: 1.37x min-of-9 vs 0.98-1.03x battery medians; 20000 a 0.94-1.05x
    wash). The dev box (AMD Zen 4, numpy 2.4.5) still won ~2x at
    10_000-100_000, so the cap deliberately forfeits that regime to keep
    every admitted cell winning on both benchmark machines.
