maintainer_objections:
  - author: seberg
    date: "2019-11-28"
    quote: >-
      Not sure, but I feel it would likely be best thing would be to
      document that sets are preferable for object arrays. I do not think
      all ordered types are hashable, so "just using a hashtable" has its
      problem as well.
