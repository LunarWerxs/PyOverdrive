id: OPP-000036
title: "numpy.isin/numpy.in1d always take the O(n*m) broadcast-equality path on object-dtype arrays, ~100-150x slower than a Python set membership test"
sources:
  - url: https://github.com/numpy/numpy/issues/14997
    repository: numpy/numpy
    type: issue
    number: 14997
    state_at_ingestion: open
    retrieved_at: "2026-08-24T12:00:00Z"
claim:
  speedup: 100.0
  baseline: >-
    np.isin(arr1, arr2) with arr1 = np.arange(1000000, dtype=object) and
    arr2 = np.array([-1]*1000 + [0], dtype=object) (1001 elements, 2
    distinct values), timed with time.time() around the call in the issue
    body. The reporter states only "This will take around 10/15 seconds"
    (a prose estimate, not a printed timeit/time.time() figure captured in
    the dump). A code comment on the same line adds a second, larger data
    point at 10x the arr2 length: "# Increasing to 10000 slows to ~120
    seconds" (arr2 = 1001 -> 10001 elements, still 2 distinct values).
  candidate: >-
    np.isin(arr1, arr3) with arr3 = np.array([n for n in set(arr2)],
    dtype=object), i.e. arr2 deduplicated through a Python set before the
    isin call. The reporter states "This will take no longer than ~0.1
    seconds, regardless of how large arr2 is" (also prose, not a printed
    figure). The 3-way speedup claim here is DERIVED from the reporter's
    own pair of estimates: low end 10 / 0.1 = 100, high end 15 / 0.1 = 150;
    100.0 (the conservative low end) is recorded as claim.speedup. The
    auxiliary 10000-length data point gives a further DERIVED ratio of
    120 / 0.1 = 1200, not used as the headline number because it is the
    comment aside rather than the reproducing example's primary pair.
  hardware: >-
    unknown; the issue body gives no CPU, OS, RAM, Python, or numpy version
    anywhere in the dump. The reporter says only "Numpy is lacking an
    optimization" with no environment details.
affected_operations: [numpy.isin, numpy.in1d]
input_regime:
  dtypes: [object]
  sizes: [1000000, 1001, 10001]
  notes: >-
    Measured concretely only for arr1 = np.arange(1000000, dtype=object)
    against arr2 in {1001, 10001} elements, both built as
    [-1]*N + [0] (exactly 2 distinct values, -1 and 0), object dtype
    throughout. The candidate's "regardless of how large arr2 is" framing
    is confounded by this specific example: because arr2 always contains
    only 2 distinct values, set(arr2) always collapses arr3 to length 2
    regardless of arr2's raw length, so growing arr2 from 1001 to 10001
    elements does not grow the candidate's actual working set at all. The
    thread does not test a case where arr2's raw length AND its distinct-
    value cardinality both grow, so the size-invariance claim is
    unverified for high-cardinality arr2.
    The issue body also states numpy's general in1d size-relationship
    condition: "they meet a specific size relationship (namely,
    len(ar2) < 10 * len(ar1) ** 0.145)" triggers the same O(n*m) path
    independent of dtype. For the reporter's own arr1 (len 1,000,000)
    this evaluates to 10 * 1000000**0.145 = 10 * 10**(6*0.145) =
    10 * 10**0.87 ~= 10 * 7.413 = 74.13, i.e. len(ar2) < ~74.13. Both of
    the reporter's arr2 sizes (1001 and 10001) exceed that threshold, so
    in this example it is the object-dtype OR-clause alone, not the size-
    relationship clause, that forces the slow path; on non-object dtypes
    the same O(n*m) path would trigger separately whenever ar2 is smaller
    than ~74 elements relative to a million-element ar1.
