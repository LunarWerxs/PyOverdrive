notes:
  - >-
    SHIPPED (2026-08-24) as isin_object_hash
    (src/pyoverdrive/fastpaths/isin_object_hash.py): 1-D object pairs,
    combined >= 300; NaN-like objects and unhashable members are
    answered BY STOCK inside the run (stock_fn, never the dispatcher's
    warning path), so the result is always stock's. license_review
    clean: standard hash-set technique.
  - >-
    Mechanism, per the issue body: "If numpy detects that either array has
    an object dtype, or that they meet a specific size relationship
    (namely, len(ar2) < 10 * len(ar1) ** 0.145), it will proceed to
    evaluate at a O(n*m) speed, where n = len(arr1) and m = len(arr2)."
    For object dtype specifically this branch is unconditional (the OR is
    dtype-triggered regardless of the size relationship above): every
    object-dtype isin/in1d call takes the O(n*m) broadcast-equality path,
    "only optimized for dealing with non-object arrays that don't meet a
    specific size relationship" per the reporter.
  - >-
    The transparent fast-path sketch this record proposes: numpy.isin is
    already a patched op in PyOverdrive for StringDType via
    isin_string_hash (OPP-000023, SHIPPED, verified_speedup 2318.54x on
    the Dyno run). This record proposes an object-dtype sibling route:
    when either operand is a plain object-dtype array, build a Python set
    from test_elements (ar2) and probe membership of each element (ar1)
    against that set, returning the same boolean array stock returns -
    mirroring both the reporter's own reproducer snippet and
    chaburkland's proposed dispatch code in the second comment.
  - >-
    HAZARD (a), hashability: seberg's comment above is explicit that "not
    all ordered types are hashable, so 'just using a hashtable' has its
    problem as well." Mitigation: attempt the set(test_elements) build and
    fall back to stock INTERNALLY (calling stock_fn directly) on TypeError,
    never by routing back through the dispatcher's warning/reporting path.
    Separately, chaburkland's own proposed fallback code in the second
    comment catches ValueError around the set() build ("except ValueError:
    # Fallback if some element was unhashable"), but CPython's set()
    raises TypeError, not ValueError, on an unhashable element - the
    reporter's own mitigation snippet would not actually catch the failure
    it is written to catch. This record's fallback must catch TypeError.
  - >-
    HAZARD (b), NaN semantics: Python's `in` operator on a set/list checks
    identity before equality, so a single float('nan') object matches
    itself via `nan_obj in {nan_obj}` (identity short-circuit), while
    stock's broadcast-equality object path compares via `==`, where
    nan != nan is False. A set-membership dispatch route therefore
    diverges from stock on NaN-containing object arrays unless NaN-like
    objects (x != x) are refused from the fast path or special-cased. The
    thread does not test or discuss NaN objects at all; this hazard is
    not thread-sourced and must be probed empirically against stock's
    ACTUAL object-path semantics in the reproducer before any dispatch
    threshold is set.
  - >-
    HAZARD (c), eq/hash contract violations: an object whose __eq__ and
    __hash__ disagree (violates the Python data model's hash/eq contract)
    can silently break set-membership lookups - a value considered equal
    by __eq__ can land in a different hash bucket and be missed, with no
    exception raised, differing silently from stock's pairwise ==
    comparison. This is unguardable in general (no runtime check proves
    an object's __eq__/__hash__ are consistent), so the route must be
    scoped to a probe-verified contract (well-behaved builtins and
    documented-hashable user types) and lean on the differential
    correctness battery to catch violations in practice rather than a
    static guarantee.
  - >-
    Numeric/bit mode: bit-identical (bool array) output is the target, but
    only conditional on hazards (b) NaN semantics and (c) eq/hash
    consistency being guarded per above; without those guards a dispatch
    route can silently diverge from stock rather than merely being slower.
  - >-
    In1d/isin relationship and deprecation status: the issue body states
    in1d "is used by isin" and the reporter reproduces only against
    np.isin directly. Nothing in the issue or its three comments mentions
    numpy.in1d's deprecation status in numpy 2.x; that claim is NOT
    sourced from this thread and is not asserted here. Both operations are
    listed in affected_operations solely because the issue title
    ("isin() and in1d() perform slowly on object arrays") and body name
    both explicitly as sharing the same underlying _isin/O(n*m) code path.
  - >-
    Community follow-up, unquantified: a third comment (randomseed42,
    2023-09-19, author_association NONE, no numbers given) reports a
    similar set-based workaround for the string case ("subset =
    set(arr1).intersection(set(arr2)); result = [item in subset for item
    in arr1]") being "so much faster than np.isin", with no timing data,
    3.5 years after the second comment and with zero further replies in
    the dump.
  - >-
    Relation to OPP-000023: that record ships isin_string_hash for plain
    StringDType arrays (na_object-carrying dtypes refused), a narrower
    dtype than the generic object dtype this issue is about, but the same
    hash-set-membership mechanism and the same class of hazards
    (unhashable/na_object edge cases forcing an internal, non-dispatcher
    fallback). OPP-000023's notes independently flag a stock NUL-string
    isin bug found during Dyno testing, underscoring that this hash-route
    family needs the same differential-battery discipline here.
  - >-
    Thread engagement: 3 comments total, opened 2019-11-27 by chaburkland
    (author_association NONE), open as of state_at_ingestion with no
    linked PRs anywhere in the dump. Labeled "01 - Enhancement" and
    "04 - Documentation" and "component: numpy.lib"; the Documentation
    label is consistent with seberg's suggestion to document the
    set-preference workaround rather than change code.
  - >-
    license_review is pending because no candidate implementation has been
    drafted or reviewed yet; status is unverified because no Dyno
    reproducer has been run (current_numpy_result, main_branch_result, and
    reproducer are all null pending that work).
